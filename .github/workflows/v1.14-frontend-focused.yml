name: V1.14 Frontend Focused

on:
  push:
    branches:
      - v1.14-f
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-finishing:
    name: Bootstrap 5 visual finishing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Apply idempotent V1.14-F visual finishing
        shell: bash
        run: |
          set -euo pipefail
          git show origin/v1.14-e:public/css/dashboard.css > public/css/dashboard.css
          if ! grep -Fq 'V1.14-F: Bootstrap 5 / Bootswatch visual finishing.' public/css/dashboard.css; then
            printf '\n' >> public/css/dashboard.css
            cat tools/v1.14-f-visual.css >> public/css/dashboard.css
          fi

      - name: Validate Bootstrap and Bootswatch assets
        shell: bash
        run: |
          set -euo pipefail
          test -s FRONTEND_ASSETS_V1_14_C.sha256
          test "$(wc -l < FRONTEND_ASSETS_V1_14_C.sha256)" -eq 9
          sha256sum -c FRONTEND_ASSETS_V1_14_C.sha256
          grep -Fq 'Bootstrap v5.3.8' public/js/bootstrap.bundle-5.3.8.min.js
          for theme in flatly journal minty sketchy slate solar yeti; do
            grep -Fq 'Bootswatch v5.3.8' "public/css/bootstrap-${theme}-5.3.8.min.css"
          done

      - name: Validate all Theme resolver targets
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "app/common/common_func.php";
            $keys = ["bootstrap","bootstrap-yeti","bootstrap-minty","bootstrap-flatly","bootstrap-journal","bootstrap-sketchy","bootstrap-solar","bootstrap-slate"];
            foreach ($keys as $key) {
                $file = resolve_theme_stylesheet($key);
                if (!preg_match("/(?:bootstrap|bootstrap-[a-z]+)-5\\.3\\.8\\.min\\.css$/", $file)) { fwrite(STDERR, "Unexpected theme: $key=$file\n"); exit(1); }
                if (!is_file("public/css/" . $file)) { fwrite(STDERR, "Missing theme asset: $file\n"); exit(1); }
                echo "$key=$file\n";
            }
          '

      - name: Validate V1.14-F visual markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          failed = False
          dashboard = Path('public/css/dashboard.css').read_text()
          dashboard_markers = [
              'V1.14-F: Bootstrap 5 / Bootswatch visual finishing.',
              '.form-label .text-dark,',
              'legend.text-dark',
              '.navbar-light.app-navbar',
              '.navbar-dark.app-navbar',
              '.modal-header .btn-close-white',
              '.drawer-close',
              'var(--bs-body-bg, #fff)',
              'var(--bs-body-color, #212529)',
              '--bs-offcanvas-width: min(16.25rem, 86vw);',
          ]
          for marker in dashboard_markers:
              ok = marker in dashboard
              print(f'dashboard.css: {marker}: {"OK" if ok else "FAIL"}')
              failed = failed or not ok

          for marker in [
              '.navbar-icon-setting > label.form-label',
              '#main-content .mail-card-inner',
              '#main-content .links-card-inner',
              '#main-content .weather-card-inner',
          ]:
              ok = marker in dashboard
              print(f'dashboard.css: {marker}: {"OK" if ok else "FAIL"}')
              failed = failed or not ok

          for old_asset in ['public/css/drawer.min.css','public/js/drawer.min.js','public/js/iscroll.js','public/js/popper.min.js']:
              if Path(old_asset).exists():
                  print(f'Legacy dependency returned: {old_asset}')
                  failed = True

          for page in ['public/index.php','public/settings.php','public/stock.php']:
              source = Path(page).read_text()
              ok = 'bootstrap.bundle-5.3.8.min.js' in source and 'data-bs-toggle="offcanvas"' in source
              print(f'{page}: Bootstrap 5 / Offcanvas: {"OK" if ok else "FAIL"}')
              failed = failed or not ok

          if failed:
              sys.exit(1)
          PY

      - name: Validate V1.14-F production scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v1.14-e:refs/remotes/origin/v1.14-e
          mapfile -t changed < <(git diff --name-only origin/v1.14-e...HEAD -- app public | sort)
          expected=(
            public/css/dashboard.css
          )
          printf 'Changed app/public files:\n%s\n' "${changed[*]}"
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo 'Unexpected V1.14-F production scope.' >&2
            exit 1
          fi

      - name: PHP syntax focused check
        shell: bash
        run: |
          set -euo pipefail
          find app public -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/v1.14-f-php-lint.txt
          cat /tmp/v1.14-f-php-lint.txt

      - name: JavaScript syntax focused check
        shell: bash
        run: |
          set -euo pipefail
          node --check public/js/dashboard.js
          node --check public/js/mail-widget.js
          node --check public/js/calendar.js

      - name: Commit generated V1.14-F source when needed
        id: source_commit
        shell: bash
        run: |
          set -euo pipefail
          git add public/css/dashboard.css
          if git diff --cached --quiet; then
            echo 'created=false' >> "${GITHUB_OUTPUT}"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(v1.14-f): apply visual finishing CSS'
            git push origin HEAD:v1.14-f
            echo 'created=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Branch diff whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/v1.14-e...HEAD

      - name: Build production verification ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_root="${RUNNER_TEMP}/rss-reader-v1.14-f-production-app-public"
          rm -rf "${package_root}"
          mkdir -p "${package_root}"
          cp -a app "${package_root}/app"
          cp -a public "${package_root}/public"
          cp .htaccess "${package_root}/.htaccess"
          cp APPLY_NOTE_V1_14_F.md "${package_root}/APPLY_NOTE_V1_14_F.md"
          cp FRONTEND_ASSETS_V1_14_C.sha256 "${package_root}/FRONTEND_ASSETS_V1_14_C.sha256"
          source_sha="$(git rev-parse HEAD)"
          printf '%s\n' \
            'RSS Reader Modernization V1.14-F' \
            'Baseline: V1.14-E / application version 1.13.0' \
            'Checkpoint: PC/SP and all-theme visual finishing after Bootstrap 5 / Offcanvas migration.' \
            "Source commit: ${source_sha}" \
            > "${package_root}/SOURCE_BUILD.txt"
          cd "${RUNNER_TEMP}"
          zip -qr rss-reader-v1.14-f-production-app-public.zip rss-reader-v1.14-f-production-app-public
          sha256sum rss-reader-v1.14-f-production-app-public.zip > rss-reader-v1.14-f-production-app-public.zip.sha256

      - name: Upload production verification package
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-v1.14-f-production-app-public
          path: |
            ${{ runner.temp }}/rss-reader-v1.14-f-production-app-public.zip
            ${{ runner.temp }}/rss-reader-v1.14-f-production-app-public.zip.sha256
          if-no-files-found: error
          retention-days: 30
