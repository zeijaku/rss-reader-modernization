name: V1.34 Release Sync Apply

on:
  push:
    branches:
      - release/v1.34.0
    paths:
      - '.github/workflows/v134-release-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.34.0
          fetch-depth: 0
      - name: Apply verified V1.34 release source
        shell: bash
        run: bash .release-sync/apply.sh
# retry after release-contract correction
