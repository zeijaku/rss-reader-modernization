name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Final semantic version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Final release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout release-ready main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP 8.4 for preflight
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Resolve release context
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${INPUT_VERSION}"
          if ! [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release version must be final SemVer X.Y.Z.' >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != 'main' ]; then
            echo 'Final Release must be dispatched from main.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=v${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "RUNTIME_STEM=rss-reader-modernization-${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "COMPLETE_STEM=rss-reader-modernization-${RELEASE_VERSION}-complete" >> "${GITHUB_ENV}"

      - name: Validate release-ready source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_release_ready.py --release "${RELEASE_VERSION}"
          python3 tests/test_version_dependency_hygiene.py
          python3 tests/test_workflow_hygiene.py
          python3 tests/test_release_flow.py

      - name: Preflight main and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "${REMOTE_MAIN}" ] || [ "${REMOTE_MAIN}" != "${GITHUB_SHA}" ]; then
            echo 'main moved after this Release run started. Refusing to publish a stale commit.' >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            PEELED="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
            if [ -z "${PEELED}" ]; then
              PEELED="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
            fi
            if [ "${PEELED}" != "${GITHUB_SHA}" ]; then
              echo "${TAG} already exists on a different commit. Refusing to overwrite it." >&2
              exit 1
            fi
            echo "${TAG} already points to this release commit."
          fi

      - name: Set up PHP 8.1 regression runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Run PHP 8.1 release regression
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-current.sh
          bash tests/run-v117.sh
          bash tests/run-v1171.sh
          bash tests/run-v1172.sh
          bash tests/run-v118.sh
          bash tests/run-v119.sh
          bash tests/run-v119c.sh
          bash tests/run-v119d.sh
          bash tests/run-v121-compat.sh
          bash tests/run-v122b.sh
          bash tests/run-v122c.sh
          bash tests/run-v122d.sh

      - name: Set up PHP 8.4 regression runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Run PHP 8.4 release regression
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-current.sh
          bash tests/run-v117.sh
          bash tests/run-v1171.sh
          bash tests/run-v1172.sh
          bash tests/run-v118.sh
          bash tests/run-v119.sh
          bash tests/run-v119c.sh
          bash tests/run-v119d.sh
          bash tests/run-v121-compat.sh
          bash tests/run-v122b.sh
          bash tests/run-v122c.sh
          bash tests/run-v122d.sh

      - name: High-signal source secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=dist --exclude='*.md' --exclude='.env.example' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|mysql:[^\n]*(password|pwd)=|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' app public config tools; then
            echo 'Potential secret pattern found.' >&2
            exit 1
          fi
          test ! -f config/local.php
          echo 'PASS: high-signal source secret scan'

      - name: Build and verify release packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 tools/build_release_package.py \
            --release "${RELEASE_VERSION}" \
            --mode final \
            --output-dir dist
          python3 tools/verify_release_package.py \
            --release "${RELEASE_VERSION}" \
            "dist/${RUNTIME_STEM}.zip" \
            "dist/${RUNTIME_STEM}.zip.sha256"
          python3 tools/build_complete_package.py \
            --release "${RELEASE_VERSION}" \
            --output-dir dist
          python3 tools/verify_complete_package.py \
            --release "${RELEASE_VERSION}" \
            "dist/${COMPLETE_STEM}.zip" \
            "dist/${COMPLETE_STEM}.zip.sha256"
          (cd dist && sha256sum -c "${RUNTIME_STEM}.zip.sha256")
          (cd dist && sha256sum -c "${COMPLETE_STEM}.zip.sha256")

      - name: Runtime package clean-room checks
        shell: bash
        run: |
          set -euo pipefail
          CHECK_ROOT="${RUNNER_TEMP}/runtime-check"
          rm -rf "${CHECK_ROOT}"
          mkdir -p "${CHECK_ROOT}"
          unzip -q "dist/${RUNTIME_STEM}.zip" -d "${CHECK_ROOT}"
          ROOT_DIR="${CHECK_ROOT}/${RUNTIME_STEM}"
          test -f "${ROOT_DIR}/app/version.php"
          test -f "${ROOT_DIR}/public/index.php"
          test -f "${ROOT_DIR}/database/schema.sql"
          test ! -f "${ROOT_DIR}/config/local.php"
          php -l "${ROOT_DIR}/app/version.php"
          php -l "${ROOT_DIR}/public/index.php"
          node --check "${ROOT_DIR}/public/js/calendar.js"
          grep -Fq "const APP_VERSION = '${RELEASE_VERSION}';" "${ROOT_DIR}/app/version.php"
          grep -Fq "const APP_ASSET_REVISION = '${RELEASE_VERSION}';" "${ROOT_DIR}/app/version.php"
          echo 'PASS: Runtime package clean-room checks'

      - name: Complete Source package clean-room checks
        shell: bash
        run: |
          set -euo pipefail
          CHECK_ROOT="${RUNNER_TEMP}/complete-check"
          rm -rf "${CHECK_ROOT}"
          mkdir -p "${CHECK_ROOT}"
          unzip -q "dist/${COMPLETE_STEM}.zip" -d "${CHECK_ROOT}"
          ROOT_DIR="${CHECK_ROOT}/${COMPLETE_STEM}"
          test -f "${ROOT_DIR}/tests/run-current.sh"
          test -f "${ROOT_DIR}/.github/workflows/ci.yml"
          test -f "${ROOT_DIR}/.github/workflows/release.yml"
          test ! -f "${ROOT_DIR}/config/local.php"
          php -l "${ROOT_DIR}/app/version.php"
          node --check "${ROOT_DIR}/public/js/calendar.js"
          echo 'PASS: Complete Source package clean-room checks'

      - name: Upload final release assets
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-modernization-v${{ inputs.version }}-final
          path: |
            dist/${{ env.RUNTIME_STEM }}.zip
            dist/${{ env.RUNTIME_STEM }}.zip.sha256
            dist/${{ env.COMPLETE_STEM }}.zip
            dist/${{ env.COMPLETE_STEM }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "${REMOTE_MAIN}" ] || [ "${REMOTE_MAIN}" != "${GITHUB_SHA}" ]; then
            echo 'main moved during Release verification. Refusing to publish a stale commit.' >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            PEELED="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
            if [ -z "${PEELED}" ]; then
              PEELED="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
            fi
            if [ "${PEELED}" != "${GITHUB_SHA}" ]; then
              echo "${TAG} already exists on a different commit. Refusing to overwrite it." >&2
              exit 1
            fi
            echo "${TAG} already points to this release commit."
          else
            git tag -a "${TAG}" "${GITHUB_SHA}" -m "RSS Reader Modernization ${RELEASE_VERSION}"
            git push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; leaving it unchanged."
          else
            gh release create "${TAG}" \
              "dist/${RUNTIME_STEM}.zip" \
              "dist/${RUNTIME_STEM}.zip.sha256" \
              "dist/${COMPLETE_STEM}.zip" \
              "dist/${COMPLETE_STEM}.zip.sha256" \
              --verify-tag \
              --title "RSS Reader Modernization ${RELEASE_VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
