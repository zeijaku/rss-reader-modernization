name: Temporary V1.13-G metadata assembly

on:
  push:
    branches:
      - tmp/v113g-metadata2-20260814

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/v113g-metadata2-20260814
          fetch-depth: 0
      - name: Assemble release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/version.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const APP_VERSION = '1.12.1';", "const APP_VERSION = '1.13.0';")
          s = s.replace("const APP_VERSION_LABEL = 'RSS Reader Modernization 1.12.1';", "const APP_VERSION_LABEL = 'RSS Reader Modernization 1.13.0';")
          p.write_text(s, encoding='utf-8', newline='\n')
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = "**Stable release:** `RSS Reader Modernization 1.12.1`\nRelease tag: `v1.12.1`\n\n"
          new = "**Stable release:** `RSS Reader Modernization 1.13.0`\nRelease tag: `v1.13.0`\n\nVersion 1.13.0では、Dashboard構造整理を中心に、Stock一覧を`/stock`、表示設定・タブ名・RSS Highlight設定を`/settings`へ分離し、Dashboard本体も内部Viewへ分割しました。既存の`/?tab=stock`互換、Account Settings、Stock／Settingsの既存動作は維持しています。Performance再計測では追加最適化を行う根拠となる劣化を確認せず、Security／新規設置DocumentationとHealthcheckを整理しました。新しいDB Migration／config追加はありません。\n\n"
          if old not in s:
              raise SystemExit('README release marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          entry = "## RSS Reader Modernization 1.13.0 — 2026-08-14\n\n### Version 1.13.0 structure / performance / security finalization\n\n- Stock一覧を`public/stock.php`へ分離し、Canonical routeを`/stock`へ整理。既存`/?tab=stock`は検索・並び替え・Page・Tag条件を維持して互換Redirect。\n- 表示設定、Tab名、RSS Highlight設定を`public/settings.php`へ分離し、`/settings`へ集約。Account Settingsは従来どおりDashboard Modalを維持。\n- `public/index.php`のDashboard Widget／Modal表示を内部Viewへ分割し、既存DOM／CSS／JavaScript／API契約を変えず可読性を改善。\n- V1.13-A／EのPerformance計測を比較し、Stock DB helperを含め追加最適化が必要な劣化は確認されなかったため、根拠のないSQL／Cache変更は実施せず現行挙動を維持。\n- V1.13-FでSecurity Header／Session／CSRF／SSRF／XSS／API境界を再確認し、Healthcheckと新規設置／Security Documentationを現行構成へ整合。\n- 既存Migration `009_v1_9_mail_account.sql`と新規設置Schemaの説明を現行状態へ整合したが、DDL変更、新規Migration、必須config追加はなし。\n- Application Versionを`1.13.0`へ確定。\n\n"
          if not s.startswith('# Changelog\n\n'):
              raise SystemExit('Unexpected CHANGELOG header')
          p.write_text(s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/tmp-v113g-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/version.php README.md CHANGELOG.md .github/workflows/tmp-v113g-metadata.yml
          git diff --cached --check
          git commit -m 'tmp: assemble V1.13-G metadata'
          git push origin HEAD:tmp/v113g-metadata2-20260814
