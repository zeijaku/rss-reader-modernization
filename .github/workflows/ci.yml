name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Check current version dependency hygiene
        run: python3 tests/test_version_dependency_hygiene.py

      - name: Check active workflow hygiene
        run: python3 tests/test_workflow_hygiene.py

      - name: Run current regression tests
        run: bash tests/run-current.sh

      - name: Run Version 1.17 focused tests
        run: bash tests/run-v117.sh

      - name: Run Version 1.17.1 focused tests
        run: bash tests/run-v1171.sh

      - name: Run Version 1.17.2 compatibility tests
        run: bash tests/run-v1172.sh

      - name: Run Version 1.18 focused tests
        run: bash tests/run-v118.sh

      - name: Run Version 1.19 compatibility tests
        run: |
          bash tests/run-v119.sh
          bash tests/run-v119c.sh
          bash tests/run-v119d.sh

      - name: Run Version 1.21 compatibility tests
        run: bash tests/run-v121-compat.sh

      - name: Run Version 1.22-B Feed Health focused gate
        run: bash tests/run-v122b.sh

      - name: Run Version 1.22-C RSS Rules focused gate
        run: bash tests/run-v122c.sh

      - name: Run Version 1.22-D RSS Rules integration gate
        run: bash tests/run-v122d.sh
