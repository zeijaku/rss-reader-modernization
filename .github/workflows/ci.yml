name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Run the local CI-equivalent gate
        run: bash tests/run-ci.sh


      - name: Build V1.36-D verification ZIPs
        if: matrix.php == '8.4'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/v136d-prod dist/v136d-complete
          mkdir -p dist/v136d-prod dist/v136d-complete

          PROD_FILES=(
            app/version.php
            app/view/dashboard_modals.php
            public/css/calendar-event-details.css
            public/css/calendar-occurrence.css
            public/css/calendar-recurrence.css
            public/css/dashboard.css
            public/js/calendar-usability.js
            public/js/calendar.js
          )
          CHANGED_FILES=(
            "${PROD_FILES[@]}"
            tests/run-current-features.sh
            tests/test_current_calendar_occurrence_reminder_contract.py
            tests/test_current_calendar_reminder_contract.py
            tests/test_current_calendar_usability.js
            tests/test_current_v136d_usability_contract.py
          )

          for file in "${PROD_FILES[@]}"; do
            cp --parents "$file" dist/v136d-prod/
          done
          for file in "${CHANGED_FILES[@]}"; do
            cp --parents "$file" dist/v136d-complete/
          done

          cat > dist/v136d-prod/DEPLOY_V1.36-D.txt <<'EOF'
          V1.36-D production verification overlay
          Base: V1.36-C (1.36.0-dev.3) already deployed. No new database migration.

          Apply:
          1. Overwrite app/ and public/ from this ZIP.
          2. Confirm footer version: RSS Reader Modernization 1.36.0-dev.4.
          3. Hard reload once if an old Calendar asset is still cached.

          Verify:
          - Moving a start date keeps the existing start/end date span.
          - Moving a start time keeps the existing timed duration, including cross-midnight events.
          - Editing the end first establishes the new duration for the next start move.
          - End date/time cannot be selected before the start on the same effective range.
          - Calendar add/edit modals are wider on desktop, one-column on phones, internally scrollable,
            and keep URL/Memo under the Details disclosure without removing either feature.
          - Recurrence and occurrence controls remain available.
          - Dashboard navbar stays at the top while the page scrolls.
          - Notification Center, modal and offcanvas layers still appear above the sticky navbar.

          Rollback:
          Restore the V1.36-C versions of these app/public files.
          No database rollback is required.
          EOF
          cp dist/v136d-prod/DEPLOY_V1.36-D.txt dist/v136d-complete/

          (cd dist/v136d-prod && zip -qr ../rss-reader-modernization-v1.36-D-production-overlay.zip .)
          (cd dist/v136d-complete && zip -qr ../rss-reader-modernization-v1.36-D-complete-changes.zip .)

          echo '--- production overlay ---'
          unzip -l dist/rss-reader-modernization-v1.36-D-production-overlay.zip
          sha256sum dist/rss-reader-modernization-v1.36-D-production-overlay.zip
          echo '--- complete changes ---'
          unzip -l dist/rss-reader-modernization-v1.36-D-complete-changes.zip
          sha256sum dist/rss-reader-modernization-v1.36-D-complete-changes.zip

      - name: Upload V1.36-D verification ZIPs
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: v1.36-d-verification-${{ github.run_id }}
          path: |
            dist/rss-reader-modernization-v1.36-D-production-overlay.zip
            dist/rss-reader-modernization-v1.36-D-complete-changes.zip
          if-no-files-found: error
          retention-days: 7
