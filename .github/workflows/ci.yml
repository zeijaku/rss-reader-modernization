name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Run the local CI-equivalent gate
        run: bash tests/run-ci.sh


      - name: Build V1.36-B verification ZIPs
        if: matrix.php == '8.4'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/v136b-prod dist/v136b-complete
          mkdir -p dist/v136b-prod dist/v136b-complete

          PROD_FILES=(
            app/bootstrap.php
            app/calendar.php
            app/calendar_range.php
            app/calendar_recurrence.php
            app/calendar_reminder.php
            app/calendar_time.php
            app/version.php
            database/migrations/031_v1_36_calendar_reminder.sql
            public/calendar_color_api.php
            public/calendar_recurrence_api.php
            public/js/calendar-core.js
            public/js/calendar-event-details.js
            public/js/calendar-recurrence.js
            public/js/calendar-reminder-target.js
            public/js/calendar-copy.js
            public/js/calendar-drag-drop.js
            public/js/calendar.js
            public/js/notification-center.js
          )
          CHANGED_FILES=(
            "${PROD_FILES[@]}"
            database/schema.sql
            tests/run-current-features.sh
            tests/test_current_calendar_reminder.php
            tests/test_current_calendar_reminder_contract.py
            tests/test_v1_33_c_calendar_range.php
            tests/test_v1_33_c_calendar_range_http.py
            tests/test_v1_33_d_calendar_exception.php
            tests/test_v1_33_d_calendar_exception_http.py
            tests/test_v1_34_2_b_calendar_copy.js
            tests/test_v1_34_2_b_calendar_copy_contract.py
            tests/test_v1_34_2_c_calendar_drag_drop.js
            tests/test_v1_34_2_c_calendar_drag_drop_contract.py
          )

          for file in "${PROD_FILES[@]}"; do
            cp --parents "$file" dist/v136b-prod/
          done
          for file in "${CHANGED_FILES[@]}"; do
            cp --parents "$file" dist/v136b-complete/
          done

          cat > dist/v136b-prod/DEPLOY_V1.36-B.txt <<'EOF'
          V1.36-B production verification overlay
          Base: V1.36-A (1.36.0-dev.1) already deployed

          Apply order:
          1. Run database/migrations/031_v1_36_calendar_reminder.sql
             Set @table_prefix to the production DB_TABLE_PREFIX if it is not ig_.
          2. Overwrite app/ and public/ from this ZIP.
          3. Do NOT execute database/schema.sql on an existing production database.
          4. Confirm footer version: RSS Reader Modernization 1.36.0-dev.2.

          Scope:
          - Normal Calendar event reminders only.
          - Recurring/Occurrence reminders remain disabled until V1.36-C.
          - All-day reminder reference time is 09:00 Asia/Tokyo.

          Rollback:
          1. Restore the V1.36-A app/ and public/ files first.
          2. Optional DB rollback after code rollback:
             ALTER TABLE <DB_TABLE_PREFIX>calendar_event DROP COLUMN calendar_event_reminder;
          EOF
          cp dist/v136b-prod/DEPLOY_V1.36-B.txt dist/v136b-complete/

          (cd dist/v136b-prod && zip -qr ../rss-reader-modernization-v1.36-B-production-overlay.zip .)
          (cd dist/v136b-complete && zip -qr ../rss-reader-modernization-v1.36-B-complete-changes.zip .)
          unzip -l dist/rss-reader-modernization-v1.36-B-production-overlay.zip
          unzip -l dist/rss-reader-modernization-v1.36-B-complete-changes.zip

      - name: Upload V1.36-B verification ZIPs
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: v1.36-b-verification-${{ github.run_id }}
          path: |
            dist/rss-reader-modernization-v1.36-B-production-overlay.zip
            dist/rss-reader-modernization-v1.36-B-complete-changes.zip
          if-no-files-found: error
          retention-days: 7
