name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Run the local CI-equivalent gate
        run: bash tests/run-ci.sh

      - name: Build V1.37-A dev.2 production overlay
        if: ${{ matrix.php == '8.4' }}
        run: |
          zip -q v1.37-a-2048-production-overlay-dev2.zip \
            app/mini_game.php \
            app/version.php \
            public/css/game-2048.css \
            public/index.php \
            public/js/game-2048.js \
            public/js/mini-game.js \
            public/stock.php

      - name: Upload V1.37-A dev.2 production overlay
        if: ${{ matrix.php == '8.4' }}
        uses: actions/upload-artifact@v4
        with:
          name: v1.37-a-2048-production-overlay-dev2
          path: v1.37-a-2048-production-overlay-dev2.zip
          if-no-files-found: error
          retention-days: 7
