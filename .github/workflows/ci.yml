name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Check current version dependency hygiene
        run: python3 tests/test_version_dependency_hygiene.py

      - name: Check active workflow hygiene
        run: python3 tests/test_workflow_hygiene.py

      - name: Check standard release flow hygiene
        run: python3 tests/test_release_flow.py

      - name: Check V1.34.2-A smartphone modal contract
        run: python3 tests/test_v1_34_2_a_modal_background.py

      - name: Run current core regression tests
        run: bash tests/run-current.sh

      - name: Diagnose feature contracts before Calendar
        run: bash tests/run-current-feature-diagnostics.sh pre-calendar

      - name: Diagnose V1.33-I checkpoint release contract
        run: python3 tests/test_v1_33_i_final_release.py

      - name: Diagnose V1.33 RC2 asset loader
        run: node tests/test_v1_33_rc2_asset_loader.js

      - name: Diagnose V1.25 Calendar contracts
        run: |
          php tests/test_v1_25_b_calendar_time_contract.php
          php tests/test_v1_25_b_calendar_time_validation.php
          php tests/test_v1_25_c_calendar_event_ui_contract.php
          php tests/test_v1_25_d_recurrence_contract.php
          php tests/test_v1_25_d_recurrence_validation.php
          php tests/test_v1_25_e_calendar_source_actions_contract.php
          php tests/test_v1_25_f_calendar_polish_contract.php
          php tests/test_v1_25_f_calendar_polish_r3_contract.php

      - name: Diagnose V1.33-C Calendar contracts
        run: |
          php tests/test_v1_33_c_calendar_range.php
          python3 tests/test_v1_33_c_calendar_range_http.py
          python3 tests/test_v1_33_c_calendar_range_contract.py
          node tests/test_v1_33_c_calendar_range_ui.js
          node tests/test_v1_33_c_calendar_submit_ui.js

      - name: Diagnose V1.33-D exception runtime
        run: php tests/test_v1_33_d_calendar_exception.php

      - name: Diagnose V1.33-D exception HTTP
        run: python3 tests/test_v1_33_d_calendar_exception_http.py

      - name: Diagnose V1.33-D exception contract
        run: python3 tests/test_v1_33_d_calendar_exception_contract.py

      - name: Diagnose V1.33-D MariaDB migration
        run: sh tests/test_v1_33_d_mariadb_migration.sh

      - name: Diagnose V1.33-E+ Calendar contracts
        run: |
          python3 tests/test_v1_33_e_calendar_occurrence_contract.py
          node tests/test_v1_33_e_calendar_occurrence_ui.js
          python3 tests/test_v1_33_f_calendar_month_layout_contract.py
          node tests/test_v1_33_f_calendar_month_layout.js
          node tests/test_v1_33_f_calendar_month_dom.js
          python3 tests/test_v1_33_g_calendar_views_contract.py
          node tests/test_v1_33_g_calendar_views.js
          node tests/test_v1_33_g_calendar_views_dom.js
          python3 tests/test_v1_33_g_r1_calendar_toolbar_contract.py
          python3 tests/test_v1_33_i_final_release.py
          php -l app/calendar_exception.php
          node --check public/js/calendar-core.js
          node --check public/js/calendar-occurrence.js
          node --check public/js/calendar-month-layout.js
          node --check public/js/calendar-views.js
          node --check public/js/calendar.js
          node tests/test_v1_33_rc2_asset_loader.js
          node --check public/js/calendar-recurrence.js
          node --check public/js/calendar-event-details.js
          node --check public/js/calendar-source-actions.js
          node --check public/js/calendar-polish.js
          node --check public/js/calendar-polish-r3.js

      - name: Diagnose feature contracts after Calendar
        run: bash tests/run-current-feature-diagnostics.sh post-calendar

      - name: Run current feature contract tests
        run: bash tests/run-current-features.sh
