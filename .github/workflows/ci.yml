name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Check current version dependency hygiene
        run: python3 tests/test_version_dependency_hygiene.py

      - name: Check active workflow hygiene
        run: python3 tests/test_workflow_hygiene.py

      - name: Check standard release flow hygiene
        run: python3 tests/test_release_flow.py

      - name: Check V1.34.2-A smartphone modal contract
        run: python3 tests/test_v1_34_2_a_modal_background.py

      - name: Check V1.34.2-B Calendar copy contracts
        run: |
          python3 tests/test_v1_34_2_b_calendar_copy_contract.py
          node tests/test_v1_34_2_b_calendar_copy.js
          node --check public/js/calendar-copy.js

      - name: Check V1.34.2-C Calendar drag and drop contracts
        run: |
          python3 tests/test_v1_34_2_c_calendar_drag_drop_contract.py
          node tests/test_v1_34_2_c_calendar_drag_drop.js
          node --check public/js/calendar-drag-drop.js

      - name: Check V1.34.2-D Card mouse wheel contract
        run: python3 tests/test_v1_34_2_d_card_mouse_wheel.py

      - name: Run current core regression tests
        run: bash tests/run-current.sh

      - name: Run current feature contract tests
        run: bash tests/run-current-features.sh

      - name: Build V1.34.2-dev.7 rental-server ZIP
        if: matrix.php == '8.1'
        run: |
          zip -9 rss-reader-modernization-v1.34.2-dev.7-card-mouse-wheel.zip \
            app/version.php \
            public/js/calendar.js \
            public/css/dashboard-card-wheel.css \
            public/js/camera-video-streaming.js \
            public/js/rss-management.js
          unzip -t rss-reader-modernization-v1.34.2-dev.7-card-mouse-wheel.zip

      - name: Upload V1.34.2-dev.7 rental-server ZIP
        if: matrix.php == '8.1'
        uses: actions/upload-artifact@v4
        with:
          name: v1.34.2-dev.7-card-mouse-wheel
          path: rss-reader-modernization-v1.34.2-dev.7-card-mouse-wheel.zip
          if-no-files-found: error
