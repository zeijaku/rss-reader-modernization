name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Run the local CI-equivalent gate
        run: bash tests/run-ci.sh


      - name: Build V1.36-C verification ZIPs
        if: matrix.php == '8.4'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/v136c-prod dist/v136c-complete
          mkdir -p dist/v136c-prod dist/v136c-complete

          PROD_FILES=(
            app/api/dashboard.php
            app/calendar_exception.php
            app/calendar_reminder.php
            app/notification.php
            app/version.php
            public/calendar_recurrence_api.php
            public/js/calendar-copy.js
            public/js/calendar-event-details.js
            public/js/calendar-occurrence.js
            public/js/calendar-recurrence.js
            public/js/calendar-reminder-target.js
          )
          CHANGED_FILES=(
            "${PROD_FILES[@]}"
            tests/run-current-features.sh
            tests/test_current_calendar_occurrence_reminder.php
            tests/test_current_calendar_occurrence_reminder_contract.py
            tests/test_current_calendar_reminder.php
            tests/test_current_calendar_reminder_contract.py
            tests/test_v1_33_d_calendar_exception_http.py
            tests/test_v1_34_2_b_calendar_copy.js
            tests/test_v1_34_2_b_calendar_copy_contract.py
          )

          for file in "${PROD_FILES[@]}"; do
            cp --parents "$file" dist/v136c-prod/
          done
          for file in "${CHANGED_FILES[@]}"; do
            cp --parents "$file" dist/v136c-complete/
          done

          cat > dist/v136c-prod/DEPLOY_V1.36-C.txt <<'EOF'
          V1.36-C production verification overlay
          Base: V1.36-B (1.36.0-dev.2) already deployed with migrations 030 and 031.

          Apply order:
          1. No database migration is required for V1.36-C.
          2. Overwrite app/ and public/ from this ZIP.
          3. Confirm footer version: RSS Reader Modernization 1.36.0-dev.3.

          Scope:
          - Recurring Calendar series may use the existing reminder choices.
          - Each occurrence inherits the series reminder setting.
          - Occurrence move/time edits reschedule its pending reminder using the effective date/time.
          - Occurrence cancel removes only that pending reminder.
          - Occurrence restore recreates the pending reminder.
          - Already-due notification history is preserved.
          - Copying one occurrence creates a standalone event and preserves its inherited reminder.
          - All-day reminder reference time remains 09:00 Asia/Tokyo.

          Rollback:
          Restore the V1.36-B app/ and public/ files.
          No database rollback is required for V1.36-C.
          EOF
          cp dist/v136c-prod/DEPLOY_V1.36-C.txt dist/v136c-complete/

          (cd dist/v136c-prod && zip -qr ../rss-reader-modernization-v1.36-C-production-overlay.zip .)
          (cd dist/v136c-complete && zip -qr ../rss-reader-modernization-v1.36-C-complete-changes.zip .)

          echo '--- production overlay ---'
          unzip -l dist/rss-reader-modernization-v1.36-C-production-overlay.zip
          echo '--- complete changes ---'
          unzip -l dist/rss-reader-modernization-v1.36-C-complete-changes.zip

      - name: Upload V1.36-C verification ZIPs
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: v1.36-c-verification-${{ github.run_id }}
          path: |
            dist/rss-reader-modernization-v1.36-C-production-overlay.zip
            dist/rss-reader-modernization-v1.36-C-complete-changes.zip
          if-no-files-found: error
          retention-days: 7
