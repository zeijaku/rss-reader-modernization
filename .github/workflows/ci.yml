name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Run regression tests
        shell: bash
        run: |
          bash tests/run.sh 2>&1 | tee "${RUNNER_TEMP}/regression.log"

      - name: Capture regression failure tail
        if: failure()
        shell: bash
        run: |
          tail -n 200 "${RUNNER_TEMP}/regression.log" > "${RUNNER_TEMP}/regression-tail.txt"

      - name: Upload regression failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-php-${{ matrix.php }}
          path: ${{ runner.temp }}/regression-tail.txt
          if-no-files-found: error
          retention-days: 3
