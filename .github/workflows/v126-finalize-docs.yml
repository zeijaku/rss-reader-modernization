name: V1.26 Finalize Documentation

on:
  push:
    branches:
      - feature/v1.26-information-board
    paths:
      - '.github/workflows/v126-finalize-docs.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.26-information-board
          fetch-depth: 0

      - name: Promote README and CHANGELOG to V1.26.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '**Stable release:** `RSS Reader Modernization 1.25.0`',
              '**Stable release:** `RSS Reader Modernization 1.26.0`',
              1,
          )
          readme = readme.replace('Release tag: `v1.25.0`', 'Release tag: `v1.26.0`', 1)
          intro = (
              'Version 1.26.0は、DashboardのInformationカテゴリへInformation Board Widgetを追加したReleaseです。'
              'NEWSと現在の記事Titleを固定し、RSSの概要だけを右から左へ流します。前後記事移動、Source／日時／件数、NEXT予告、進捗表示、'
              'Reduced Motion、44px Header／Smartphone Touch targetに対応します。RSS本文は既存の安全なFeed取得経路で得たdescription/contentのみを使い、'
              '記事Pageの追加FetchやScrapingは行いません。DB Migrationと新規必須Secretはありません。\n\n'
          )
          marker = 'Version 1.25.0は、Calendar Widgetを実用的な予定管理へ拡張したReleaseです。'
          if 'Version 1.26.0は、DashboardのInformationカテゴリへInformation Board Widgetを追加したReleaseです。' not in readme:
              readme = readme.replace(marker, intro + marker, 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          section = (
              '## 1.26.0 - 2026-08-30\n\n'
              '- Added the Dashboard Information Board Widget for All RSS or a specific owner-scoped Feed.\n'
              '- NEWS and the current article title remain fixed while only the sanitized RSS summary scrolls right-to-left.\n'
              '- Added 5/10/20 item limits, slow/normal/fast speed, summary ON/OFF, previous/next navigation, source/date/count footer, NEXT preview, and summary progress.\n'
              '- Uses existing RSS description/content only, bounded by the existing 4096-character RSS safety ceiling; no article-page scraping or secondary article fetch is added.\n'
              '- Preserved reduced-motion, hover/focus/touch/page-hidden pause behavior, and aligned the Information Board header with the existing 44px Dashboard header/touch targets.\n'
              '- Finalized application and asset revision markers at 1.26.0.\n'
              '- Existing authentication, authorization, CSRF, owner-scope, SSRF-safe Feed retrieval, and text-sanitization boundaries are preserved.\n'
              '- No database migration or new required secret/configuration is introduced.\n\n'
          )
          if '## 1.26.0 - 2026-08-30' not in changelog:
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Commit documentation promotion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md CHANGELOG.md; then
            echo 'Documentation already promoted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md
          git commit -m 'V1.26: finalize release documentation'
          git push origin HEAD:feature/v1.26-information-board
