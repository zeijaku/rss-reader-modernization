name: Temporary V1.46-D2 runtime package

on:
  push:
    branches:
      - feature/v1.46-d2-hls-css-finishing

permissions:
  contents: read

jobs:
  package:
    if: github.event.head_commit.message == 'Add temporary D2 package workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.46-d2-hls-css-finishing

      - name: Build runtime-only verification ZIP
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/version.php
            public/css/calendar-polish.css
            public/css/drawer-catalog.css
            public/js/calendar.js
            public/js/camera-video-streaming.js
            public/js/drawer-categories.js
            public/js/hls-1.7.3.min.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
          done
          zip -q V1.46-D2-runtime-check.zip "${files[@]}"
          sha256sum V1.46-D2-runtime-check.zip > V1.46-D2-runtime-check.zip.sha256
          unzip -Z1 V1.46-D2-runtime-check.zip
          cat V1.46-D2-runtime-check.zip.sha256

      - name: Upload runtime package
        uses: actions/upload-artifact@v4
        with:
          name: V1.46-D2-runtime-check
          path: |
            V1.46-D2-runtime-check.zip
            V1.46-D2-runtime-check.zip.sha256
          if-no-files-found: error
          retention-days: 7
