name: V1.14.1 Release Finalize

on:
  push:
    branches:
      - v1.14.1-theme-alignment

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize Version 1.14.1 source metadata
        run: python tools/tmp_v1141_finalize.py

      - name: Validate finalized metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "APP_VERSION = '1.14.1'" app/version.php
          grep -Fq "APP_VERSION_LABEL = 'RSS Reader Modernization 1.14.1'" app/version.php
          grep -Fq 'RSS Reader Modernization 1.14.1' CHANGELOG.md
          grep -Fq 'RSS Reader Modernization 1.14.1' RELEASE_NOTES.md
          grep -Fq "INTENDED_RELEASE = '1.14.1'" tools/build_release_package.py
          grep -Fq "VERSION = '1.14.1'" tools/build_complete_package.py
          grep -Fq "metadata.get('intended_release') == '1.14.1'" tools/verify_release_package.py
          grep -Fq "VERSION = '1.14.1'" tools/verify_complete_package.py
          grep -Fq 'Timer neutral surfaces follow active Bootstrap / Bootswatch Theme variables' tests/test_v15b_architecture.py
          git diff --check

      - name: Commit finalized source and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/version.php README.md CHANGELOG.md RELEASE_NOTES.md \
            tools/build_release_package.py tools/build_complete_package.py \
            tools/verify_release_package.py tools/verify_complete_package.py \
            docs/release-package.md docs/tag-and-github-release.md docs/versioning.md \
            tests/test_v15b_architecture.py
          git rm .github/workflows/tmp-v1141-release-finalize.yml tools/tmp_v1141_finalize.py
          git diff --cached --check
          git commit -m 'release: prepare version 1.14.1 theme alignment'
          git push origin HEAD:v1.14.1-theme-alignment
