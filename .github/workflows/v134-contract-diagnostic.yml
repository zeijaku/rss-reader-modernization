name: V1.34 contract diagnostic

on:
  push:
    branches:
      - release/v1.34.0

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: V1.33-E occurrence contract
        continue-on-error: true
        run: python3 tests/test_v1_33_e_calendar_occurrence_contract.py

      - name: V1.33-F month layout contract
        continue-on-error: true
        run: python3 tests/test_v1_33_f_calendar_month_layout_contract.py

      - name: V1.33-G views contract
        continue-on-error: true
        run: python3 tests/test_v1_33_g_calendar_views_contract.py

      - name: V1.33-G-R1 toolbar contract
        continue-on-error: true
        run: python3 tests/test_v1_33_g_r1_calendar_toolbar_contract.py

      - name: V1.33-I final release contract
        continue-on-error: true
        run: python3 tests/test_v1_33_i_final_release.py
