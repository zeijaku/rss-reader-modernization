name: Temporary V1.34.2-dev.9 package

on:
  push:
    branches:
      - release/v1.34.2

permissions:
  contents: write

jobs:
  prepare-package:
    if: ${{ !contains(github.event.head_commit.message, '[dev9-prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.34.2
          fetch-depth: 0

      - name: Advance checkpoint to dev.9
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '1.34.2-dev.8'
          new = '1.34.2-dev.9'
          roots = [Path('app'), Path('public'), Path('tests')]
          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.php', '.js', '.css', '.py'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      path.write_text(text.replace(old, new), encoding='utf-8')
                      changed.append(str(path))
          if not changed:
              raise SystemExit('No dev.8 checkpoint references found.')
          print('Updated checkpoint references:')
          print('\n'.join(changed))
          version = Path('app/version.php').read_text(encoding='utf-8')
          if "APP_VERSION = '1.34.2-dev.9'" not in version or "APP_ASSET_REVISION = '1.34.2-dev.9'" not in version:
              raise SystemExit('Version checkpoint did not advance coherently.')
          modal = Path('app/view/dashboard_modals.php').read_text(encoding='utf-8')
          if 'btn-close-white' in modal:
              raise SystemExit('Legacy btn-close-white remains.')
          if 'class="btn-close" data-bs-theme="dark" data-bs-dismiss="modal"' not in modal:
              raise SystemExit('Bootstrap 5.3 close-button form not found.')
          PY
          git diff --check

      - name: Run V1.34.2 A-E contracts
        run: |
          python3 tests/test_v1_34_2_a_smartphone_modal.py
          python3 tests/test_v1_34_2_b_calendar_copy_contract.py
          python3 tests/test_v1_34_2_c_calendar_drag_drop_contract.py
          python3 tests/test_v1_34_2_d_card_mouse_wheel.py
          python3 tests/test_v1_34_2_e_release_readiness.py

      - name: Commit dev.9 checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app public tests
          git diff --cached --check
          git diff --cached --quiet && { echo "No staged dev.9 changes"; exit 1; }
          git commit -m "V1.34.2: prepare dev.9 Bootstrap modal close checkpoint [dev9-prepared]"
          git push origin HEAD:release/v1.34.2

      - name: Build rental-server ZIP
        run: |
          zip -9 rss-reader-modernization-v1.34.2-dev.9-bootstrap-modal-close.zip \
            app/version.php \
            app/view/dashboard_modals.php \
            public/js/calendar.js \
            public/js/camera-video-streaming.js \
            public/js/rss-management.js
          unzip -t rss-reader-modernization-v1.34.2-dev.9-bootstrap-modal-close.zip
          sha256sum rss-reader-modernization-v1.34.2-dev.9-bootstrap-modal-close.zip

      - name: Upload rental-server ZIP
        uses: actions/upload-artifact@v4
        with:
          name: v1.34.2-dev.9-bootstrap-modal-close
          path: rss-reader-modernization-v1.34.2-dev.9-bootstrap-modal-close.zip
          if-no-files-found: error
