name: Publish V1.18.0 Release

on:
  push:
    branches:
      - release/v1.18.0-final
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish V1.18.0
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'ci: publish Version 1.18.0 release') ||
      (github.event_name == 'pull_request' && github.head_ref == 'release/v1.18.0-final')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 59d6b89971867202da808592a157fc1c2b44c16a
      RELEASE_TAG: v1.18.0
    steps:
      - name: Checkout finalized main source
        uses: actions/checkout@v4
        with:
          ref: 59d6b89971867202da808592a157fc1c2b44c16a
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release target and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -F "const APP_VERSION = '1.18.0';" app/version.php
          grep -F "const APP_VERSION_LABEL = 'RSS Reader Modernization 1.18.0';" app/version.php
          grep -F "const APP_ASSET_REVISION = '1.18.0-r2';" app/version.php

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python tools/build_release_package.py --mode final --output-dir dist
          python tools/verify_release_package.py \
            dist/rss-reader-modernization-1.18.0.zip \
            dist/rss-reader-modernization-1.18.0.zip.sha256
          python tools/build_complete_package.py --output-dir dist
          python tools/verify_complete_package.py \
            dist/rss-reader-modernization-1.18.0-complete.zip \
            dist/rss-reader-modernization-1.18.0-complete.zip.sha256
          cat dist/rss-reader-modernization-1.18.0.zip.sha256
          cat dist/rss-reader-modernization-1.18.0-complete.zip.sha256

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$existing" != "$TARGET_SHA" ]; then
              echo "ERROR: $RELEASE_TAG already points to $existing; refusing to overwrite." >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points to the expected commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "RSS Reader Modernization 1.18.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create GitHub Release and attach assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "RSS Reader Modernization 1.18.0" \
            --notes-file RELEASE_NOTES.md \
            dist/rss-reader-modernization-1.18.0.zip \
            dist/rss-reader-modernization-1.18.0.zip.sha256 \
            dist/rss-reader-modernization-1.18.0-complete.zip \
            dist/rss-reader-modernization-1.18.0-complete.zip.sha256
