name: V1.13.0 production package

on:
  push:
    branches:
      - tmp/v1130-release

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.13.0
        uses: actions/checkout@v4
        with:
          ref: v1.13.0

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9ba2ae9e46df2c42c7d8fc277a1a3ce05728bea7"
          grep -F "const APP_VERSION = '1.13.0';" app/version.php

      - name: Build production replacement ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat > DEPLOY_V1.13.0.txt <<'EOF'
          RSS Reader Modernization 1.13.0 - Production replacement package

          Contents:
          - .htaccess
          - app/    (replace the production app directory as a whole)
          - public/ (replace the production public directory as a whole)

          Before deployment:
          - Back up the current production app/, public/, and root .htaccess.
          - Keep environment-specific files/directories outside these paths unchanged.

          Database/config:
          - No new migration is required for V1.13.0.
          - Do not re-run database/migrations/009_v1_9_mail_account.sql.
          - No production DB DDL change is required.
          - No new mandatory config item is required.

          After deployment, verify:
          - Application version is 1.13.0.
          - Dashboard / loads normally.
          - /stock loads and stock operations work.
          - /settings loads and settings can be saved.
          - /?tab=stock redirects to /stock.
          - No HTTP 500 errors appear after replacing .htaccess.
          EOF

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path('.')
          out = root / 'rss-reader-v1.13.0-production-app-public.zip'
          with ZipFile(out, 'w', ZIP_DEFLATED) as zf:
              for top in [Path('.htaccess'), Path('DEPLOY_V1.13.0.txt')]:
                  zf.write(top, top.as_posix())
              for base in [Path('app'), Path('public')]:
                  for path in sorted(base.rglob('*')):
                      if path.is_file():
                          zf.write(path, path.as_posix())
          PY

          sha256sum rss-reader-v1.13.0-production-app-public.zip > rss-reader-v1.13.0-production-app-public.zip.sha256
          unzip -t rss-reader-v1.13.0-production-app-public.zip

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-v1.13.0-production-app-public
          path: |
            rss-reader-v1.13.0-production-app-public.zip
            rss-reader-v1.13.0-production-app-public.zip.sha256
          if-no-files-found: error
