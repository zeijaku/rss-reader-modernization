name: V1.22-E finalize temp

on:
  push:
    branches:
      - release/v1.22.0-finalize-work

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize Changelog anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          if '## [Unreleased]' not in s:
              s = s.replace('# Changelog\n', '# Changelog\n\n## [Unreleased]\n', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Finalize Version 1.22.0 sources
        run: python3 tools/finalize_v122_temp.py
      - name: Normalize final asset and compatibility contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, body):
              Path(path).write_text(body, encoding='utf-8', newline='\n')

          # Runtime V1.22 assets converge from checkpoint -d to the formal release key.
          for path in ('public/js/calendar.js', 'public/js/rss-management.js'):
              write(path, read(path).replace('1.22.0-d', '1.22.0'))

          # B/C focused contracts accept both staged V1.22 keys and the exact final key.
          for path in ('tests/test_v122b_feed_health.py', 'tests/test_v122c_rss_rules.py'):
              s = read(path)
              s = s.replace("asset_revision.startswith('1.22.0-')", "asset_revision == '1.22.0' or asset_revision.startswith('1.22.0-')")
              s = s.replace('V1.22 keeps a staged asset revision', 'V1.22 uses a staged or final asset revision')
              write(path, s)

          # D hard-coded checkpoint keys become the exact V1.22.0 final key.
          p = 'tests/test_v122d_rss_rules.py'
          s = read(p).replace('1.22.0-d', '1.22.0')
          s = s.replace('D has a fresh asset revision', 'D assets converge to the final V1.22 revision')
          s = s.replace('loads D Rule assets', 'loads final Rule assets')
          s = s.replace('loads D Rule display assets', 'loads final Rule display assets')
          write(p, s)

          # V1.21 formal release contract applies only to the V1.21 release itself.
          # Its Drawer compatibility tests continue to run on later releases.
          p = 'tests/run-v121e.sh'
          s = read(p)
          old = 'python3 "$ROOT/tests/test_v121e_final.py"'
          new = '''if grep -q "APP_VERSION = '1.21.0'" "$ROOT/app/version.php"; then\n    python3 "$ROOT/tests/test_v121e_final.py"\nelse\n    printf '%s\\n' 'SKIP: V1.21 formal release contract; running compatibility checks on later release.'\nfi'''
          if old not in s:
              raise SystemExit('run-v121e final-contract anchor not found')
          write(p, s.replace(old, new, 1))

          # Match the repository's existing CHANGELOG heading style.
          p = 'CHANGELOG.md'
          s = read(p).replace('## [Unreleased]\n\n', '', 1)
          s = s.replace('## [1.22.0] - 2026-08-26', '## 1.22.0 - 2026-08-26', 1)
          write(p, s)

          p = 'tests/test_v122e_final.py'
          s = read(p).replace("## [1.22.0] - 2026-08-26", "## 1.22.0 - 2026-08-26")
          write(p, s)
          PY
          rm -f .github/workflows/v122e-finalize-temp.yml tools/finalize_v122_temp.py
      - name: Run V1.22.0 final gate
        run: bash tests/run-v122e.sh
      - name: Build and verify packages
        run: |
          rm -rf dist
          python3 tools/build_release_package.py --mode final --output-dir dist
          python3 tools/verify_release_package.py dist/rss-reader-modernization-1.22.0.zip dist/rss-reader-modernization-1.22.0.zip.sha256
          python3 tools/build_complete_package.py --output-dir dist
          python3 tools/verify_complete_package.py dist/rss-reader-modernization-1.22.0-complete.zip dist/rss-reader-modernization-1.22.0-complete.zip.sha256
      - name: Archive finalized source tree
        run: |
          tar --exclude=.git --exclude=dist -czf /tmp/v122e-finalized-tree.tar.gz .
          cp /tmp/v122e-finalized-tree.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: v122e-finalized-output
          path: |
            dist/v122e-finalized-tree.tar.gz
            dist/rss-reader-modernization-1.22.0.zip
            dist/rss-reader-modernization-1.22.0.zip.sha256
            dist/rss-reader-modernization-1.22.0-complete.zip
            dist/rss-reader-modernization-1.22.0-complete.zip.sha256
          retention-days: 2
