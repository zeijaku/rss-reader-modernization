name: V1.22-E finalize temp

on:
  push:
    branches:
      - release/v1.22.0-finalize-work

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Normalize Changelog anchor for finalizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          s = p.read_text(encoding='utf-8')
          if '## [Unreleased]' not in s:
              s = s.replace('# Changelog\n', '# Changelog\n\n## [Unreleased]\n', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Finalize Version 1.22.0 sources
        run: python3 tools/finalize_v122_temp.py
      - name: Commit finalized sources
        run: |
          rm -f .github/workflows/v122e-finalize-temp.yml tools/finalize_v122_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release(v1.22.0): finalize release candidate"
          git push origin HEAD:release/v1.22.0-finalize-work
