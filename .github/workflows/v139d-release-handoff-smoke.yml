name: V1.39-D Release Handoff Smoke

on:
  push:
    branches:
      - feature/v1.39-d-release-security

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Create release-like smoke payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf 'V1.39-D release handoff smoke\ncommit=%s\n' "${GITHUB_SHA}" > dist/release-smoke.zip
          (cd dist && sha256sum release-smoke.zip > release-smoke.zip.sha256)

      - name: Attest smoke release payload
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release-smoke.zip

      - name: Upload smoke release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v139d-release-handoff-smoke-${{ github.run_id }}
          path: |
            dist/release-smoke.zip
            dist/release-smoke.zip.sha256
          if-no-files-found: error

  publish-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download smoke release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v139d-release-handoff-smoke-${{ github.run_id }}
          path: dist

      - name: Verify transferred digest and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f dist/release-smoke.zip
          test -f dist/release-smoke.zip.sha256
          (cd dist && sha256sum -c release-smoke.zip.sha256)
          gh attestation verify dist/release-smoke.zip --repo "${GITHUB_REPOSITORY}"
