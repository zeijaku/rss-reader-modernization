name: V1.39-D Attestation Smoke

on:
  push:
    branches:
      - feature/v1.39-d-release-security

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create deterministic smoke artifact
        shell: bash
        run: |
          set -euo pipefail
          printf 'V1.39-D attestation smoke\ncommit=%s\n' "${GITHUB_SHA}" > attestation-smoke.txt

      - name: Attest smoke artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: attestation-smoke.txt

      - name: Verify smoke artifact attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify attestation-smoke.txt --repo "${GITHUB_REPOSITORY}"
