name: V1.34.1 apply correction

on:
  push:
    branches: [release/v1.34.1]
    paths: [.github/workflows/v1341-apply-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.34.1
      - run: python3 tools/v1341_apply_correction.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/version.php public/js/calendar.js .github/release-request.txt tests/test_current_mail_contract.py README.md docs/configuration.md RELEASE_NOTES.md CHANGELOG.md
          git commit -m 'fix: restore received attachments for V1.34.1'
          git push origin HEAD:release/v1.34.1
