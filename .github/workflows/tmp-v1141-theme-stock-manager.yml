name: V1.14.1 Stock Tag Manager Theme Alignment

on:
  push:
    branches:
      - tmp/v1141-theme-stock-manager

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Stock tag manager Theme override
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('public/css/dashboard.css'); s=p.read_text(encoding='utf-8'); s += '\n\n/* V1.14.1: Stock Tag manager is a neutral surface and follows the active Theme. */\n.stock-tag-manager-inner {\n    border-color: var(--bs-border-color-translucent, rgba(0, 0, 0, 0.1));\n    background-color: rgba(var(--bs-body-color-rgb, 33, 37, 41), 0.045);\n    color: var(--bs-body-color, #212529);\n}\n'; p.write_text(s, encoding='utf-8')"
          grep -Fq 'background-color: rgba(var(--bs-body-color-rgb, 33, 37, 41), 0.045);' public/css/dashboard.css
          grep -Fq 'color: var(--bs-body-color, #212529);' public/css/dashboard.css
          for css in public/css/bootstrap-5.3.8.min.css public/css/bootstrap-*-5.3.8.min.css; do
            grep -Fq -- '--bs-body-color-rgb' "$css"
            grep -Fq -- '--bs-body-color' "$css"
            grep -Fq -- '--bs-border-color-translucent' "$css"
          done
          python -c "from pathlib import Path; s=Path('public/css/dashboard.css').read_text(encoding='utf-8'); assert s.count('{') == s.count('}')"
          git diff --check
      - name: Commit CSS and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/css/dashboard.css
          git rm .github/workflows/tmp-v1141-theme-stock-manager.yml
          git diff --cached --check
          git commit -m 'fix(v1.14.1): align Stock tag manager with active theme'
          git push origin HEAD:tmp/v1141-theme-stock-manager
