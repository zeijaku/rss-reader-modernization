name: V1.14 Release Gate

on:
  push:
    branches:
      - v1.14-g
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.14-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Finalize Version 1.14.0 source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply idempotent V1.14-G finalization
        run: |
          python tools/v1.14-g-finalize.py
          python tools/v1.14-g-doc-fix.py

      - name: Validate Version 1.14 release markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const APP_VERSION = '1.14.0';" app/version.php
          grep -Fq "const APP_VERSION_LABEL = 'RSS Reader Modernization 1.14.0';" app/version.php
          grep -Fq '**Stable release:** `RSS Reader Modernization 1.14.0`' README.md
          grep -Fq 'Release tag: `v1.14.0`' README.md
          grep -Fq '## RSS Reader Modernization 1.14.0 — 2026-08-14' CHANGELOG.md
          grep -Fq '# RSS Reader Modernization 1.14.0 Release Notes' RELEASE_NOTES.md
          grep -Fq 'Bootstrap | 5.3.8' docs/dependencies.md
          grep -Fq 'Bootstrap | 5.3.8' THIRD_PARTY_NOTICES.md
          grep -Fq 'remain under `licenses/` as repository history/documentation' THIRD_PARTY_NOTICES.md
          ! grep -Fq 'remain under`licenses/`' THIRD_PARTY_NOTICES.md
          grep -Fq "INTENDED_RELEASE = '1.14.0'" tools/build_release_package.py
          grep -Fq "VERSION = '1.14.0'" tools/build_complete_package.py
          ! grep -Fq '1.12.0' tools/build_release_package.py
          ! grep -Fq '1.12.0' tools/verify_release_package.py
          ! grep -Fq '1.12.0' tools/build_complete_package.py
          ! grep -Fq '1.12.0' tools/verify_complete_package.py

      - name: Validate Bootstrap and Bootswatch 5.3.8 assets
        shell: bash
        run: |
          set -euo pipefail
          test -s FRONTEND_ASSETS_V1_14_C.sha256
          test "$(wc -l < FRONTEND_ASSETS_V1_14_C.sha256)" -eq 9
          sha256sum -c FRONTEND_ASSETS_V1_14_C.sha256
          grep -Fq 'Bootstrap v5.3.8' public/js/bootstrap.bundle-5.3.8.min.js
          for theme in flatly journal minty sketchy slate solar yeti; do
            grep -Fq 'Bootswatch v5.3.8' "public/css/bootstrap-${theme}-5.3.8.min.css"
          done

      - name: Validate all Theme resolver targets
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "app/common/common_func.php";
            $keys = ["bootstrap","bootstrap-yeti","bootstrap-minty","bootstrap-flatly","bootstrap-journal","bootstrap-sketchy","bootstrap-solar","bootstrap-slate"];
            foreach ($keys as $key) {
                $file = resolve_theme_stylesheet($key);
                if (!preg_match("/(?:bootstrap|bootstrap-[a-z]+)-5\\.3\\.8\\.min\\.css$/", $file)) { fwrite(STDERR, "Unexpected theme: $key=$file\n"); exit(1); }
                if (!is_file("public/css/" . $file)) { fwrite(STDERR, "Missing theme asset: $file\n"); exit(1); }
                echo "$key=$file\n";
            }
          '

      - name: Validate legacy frontend assets are removed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          old_assets = [
              'public/css/bootstrap.min.css',
              'public/css/bootstrap.min.css.map',
              'public/css/bootstrap-yeti.min.css',
              'public/css/bootstrap-minty.min.css',
              'public/css/bootstrap-flatly.min.css',
              'public/css/bootstrap-journal.min.css',
              'public/css/bootstrap-sketchy.min.css',
              'public/css/bootstrap-solar.min.css',
              'public/css/bootstrap-slate.min.css',
              'public/js/bootstrap.min.js',
              'public/js/bootstrap.min.js.map',
              'public/css/drawer.min.css',
              'public/js/drawer.min.js',
              'public/js/iscroll.js',
              'public/js/popper.min.js',
          ]
          failed = False
          for rel in old_assets:
              exists = Path(rel).exists()
              print(f'{rel}: {"FAIL" if exists else "removed"}')
              failed = failed or exists

          legacy_names = [Path(rel).name for rel in old_assets]
          scan = []
          for root in [Path('app'), Path('public')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.php', '.js', '.css'}:
                      continue
                  if path.parent.name in {'css', 'js'} and path.name.startswith('bootstrap'):
                      continue
                  scan.append(path)
          for path in scan:
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              hits = [name for name in legacy_names if name in text]
              if hits:
                  print(f'Legacy runtime reference in {path}: {hits}')
                  failed = True
          if failed:
              sys.exit(1)
          PY

      - name: Validate Bootstrap 5 runtime cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          failed = False
          for page in ['public/index.php', 'public/settings.php', 'public/stock.php']:
              text = Path(page).read_text()
              ok = 'bootstrap.bundle-5.3.8.min.js' in text and 'data-bs-toggle="offcanvas"' in text
              legacy = any(marker in text for marker in ['data-toggle=', 'data-target=', '$.fn.drawer', '.drawer('])
              print(f'{page}: Bootstrap 5 / Offcanvas={ok}, legacy marker={legacy}')
              failed = failed or not ok or legacy
          for rel in ['app/view/dashboard_widgets.php', 'public/stock.php']:
              text = Path(rel).read_text()
              ok = text.count('text-bg-') >= 9 and 'text-white' not in text
              print(f'{rel}: automatic card contrast={ok}')
              failed = failed or not ok
          if failed:
              sys.exit(1)
          PY

      - name: Release finalization whitespace check
        run: git diff --check

      - name: Commit generated Version 1.14.0 source when needed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Version 1.14.0 source already finalized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release(v1.14-g): finalize version 1.14.0 source'
            git push origin HEAD:v1.14-g
          fi

  regression:
    name: PHP ${{ matrix.php }} full regression
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout finalized branch
        uses: actions/checkout@v4
        with:
          ref: v1.14-g
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show tested source and runtimes
        run: |
          git rev-parse HEAD
          php -v
          python --version
          node --version

      - name: Confirm final source generation is idempotent
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1.14-g-finalize.py
          python tools/v1.14-g-doc-fix.py
          git diff --exit-code

      - name: Run complete regression suite
        run: bash tests/run.sh

  package:
    name: Build and verify Version 1.14.0 artifacts
    needs:
      - prepare
      - regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout finalized branch
        uses: actions/checkout@v4
        with:
          ref: v1.14-g
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Confirm final source is clean and idempotent
        shell: bash
        run: |
          set -euo pipefail
          python tools/v1.14-g-finalize.py
          python tools/v1.14-g-doc-fix.py
          git diff --exit-code
          git diff --check
          echo "Release source: $(git rev-parse HEAD)"

      - name: Build deterministic release packages
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/release-output"
          mkdir -p "${output}"
          python tools/build_complete_package.py --output-dir "${output}"
          python tools/build_release_package.py --mode final --output-dir "${output}"
          python tools/verify_complete_package.py \
            "${output}/rss-reader-modernization-1.14.0-complete.zip" \
            "${output}/rss-reader-modernization-1.14.0-complete.zip.sha256"
          python tools/verify_release_package.py \
            "${output}/rss-reader-modernization-1.14.0.zip" \
            "${output}/rss-reader-modernization-1.14.0.zip.sha256"
          sha256sum \
            "${output}/rss-reader-modernization-1.14.0.zip" \
            "${output}/rss-reader-modernization-1.14.0-complete.zip"

      - name: Upload Version 1.14.0 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-modernization-1.14.0-release
          path: |
            ${{ runner.temp }}/release-output/rss-reader-modernization-1.14.0.zip
            ${{ runner.temp }}/release-output/rss-reader-modernization-1.14.0.zip.sha256
            ${{ runner.temp }}/release-output/rss-reader-modernization-1.14.0-complete.zip
            ${{ runner.temp }}/release-output/rss-reader-modernization-1.14.0-complete.zip.sha256
          if-no-files-found: error
          retention-days: 30
