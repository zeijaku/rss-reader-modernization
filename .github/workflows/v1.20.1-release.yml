name: V1.20.1 Release Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1.20.1-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: V1.20.1 package / release gate
    if: github.event_name != 'pull_request' || github.head_ref == 'release/v1.20.1-final'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate final Version 1.20.1 contract
        run: bash tests/run-v1201e.sh
      - name: Run current regression tests
        run: bash tests/run-current.sh
      - name: Run Version 1.17 compatibility tests
        run: bash tests/run-v117.sh
      - name: Run Version 1.17.1 compatibility tests
        run: bash tests/run-v1171.sh
      - name: Run Version 1.17.2 compatibility tests
        run: bash tests/run-v1172.sh
      - name: Run Version 1.18 compatibility tests
        run: bash tests/run-v118.sh
      - name: Run Version 1.19 compatibility tests
        run: |
          bash tests/run-v119.sh
          bash tests/run-v119c.sh
          bash tests/run-v119d.sh
      - name: High-signal source secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=dist --exclude='*.md' --exclude='.env.example' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|mysql:[^\n]*(password|pwd)=|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' app public config tools; then
            echo 'Potential secret pattern found.' >&2
            exit 1
          fi
          echo 'PASS: high-signal source secret scan'
      - name: Build and verify final packages
        run: |
          rm -rf dist
          python tools/build_release_package.py --mode final --output-dir dist
          python tools/verify_release_package.py dist/rss-reader-modernization-1.20.1.zip dist/rss-reader-modernization-1.20.1.zip.sha256
          python tools/build_complete_package.py --output-dir dist
          python tools/verify_complete_package.py dist/rss-reader-modernization-1.20.1-complete.zip dist/rss-reader-modernization-1.20.1-complete.zip.sha256
      - name: Upload Version 1.20.1 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-modernization-v1.20.1-final
          path: |
            dist/rss-reader-modernization-1.20.1.zip
            dist/rss-reader-modernization-1.20.1.zip.sha256
            dist/rss-reader-modernization-1.20.1-complete.zip
            dist/rss-reader-modernization-1.20.1-complete.zip.sha256
          if-no-files-found: error
          retention-days: 30
