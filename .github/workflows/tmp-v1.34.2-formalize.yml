name: Temporary V1.34.2 formalization

on:
  push:
    branches:
      - release/v1.34.2

permissions:
  contents: write

jobs:
  formalize:
    if: ${{ !contains(github.event.head_commit.message, '[v1.34.2-formalized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.34.2
          fetch-depth: 0

      - name: Promote dev.9 to formal 1.34.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '1.34.2-dev.9'
          new = '1.34.2'
          roots = [Path('app'), Path('public'), Path('tests')]
          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.php', '.js', '.css', '.py'}:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      path.write_text(text.replace(old, new), encoding='utf-8')
                      changed.append(str(path))
          if not changed:
              raise SystemExit('No dev.9 references found; refusing no-op formalization.')
          e = Path('tests/test_v1_34_2_e_release_readiness.py')
          text = e.read_text(encoding='utf-8')
          text = text.replace("'visible checkpoint version is dev.8'", "'visible formal version is 1.34.2'")
          text = text.replace("'visible version label is dev.8'", "'visible formal version label is 1.34.2'")
          text = text.replace("'asset revision matches dev.8'", "'formal asset revision matches 1.34.2'")
          text = text.replace("'B Calendar Copy is present in dev.8 bootstrap'", "'B Calendar Copy is present in formal bootstrap'")
          text = text.replace("'C Drag & Drop assets are present in dev.8 bootstrap'", "'C Drag & Drop assets are present in formal bootstrap'")
          text = text.replace("'D Card Mouse Wheel stylesheet is present in dev.8 bootstrap'", "'D Card Mouse Wheel stylesheet is present in formal bootstrap'")
          if "dashboard_modals.php" not in text:
              text = text.replace("workflow = (ROOT / '.github/workflows/ci.yml').read_text(encoding='utf-8')", "workflow = (ROOT / '.github/workflows/ci.yml').read_text(encoding='utf-8')\nmodals = (ROOT / 'app/view/dashboard_modals.php').read_text(encoding='utf-8')")
              marker = "check(\"test_v1_34_2_e_release_readiness.py\" in workflow, 'CI permanently runs E release-readiness checks')"
              extra = marker + "\ncheck('btn-close-white' not in modals, 'deprecated Bootstrap btn-close-white is absent from Dashboard modals')\ncheck('class=\"btn-close\" data-bs-theme=\"dark\" data-bs-dismiss=\"modal\"' in modals, 'Dashboard modal close buttons use Bootstrap 5.3 color-mode form')"
              text = text.replace(marker, extra)
          e.write_text(text, encoding='utf-8')
          version = Path('app/version.php').read_text(encoding='utf-8')
          for expected in ["APP_VERSION = '1.34.2'", "APP_VERSION_LABEL = 'RSS Reader Modernization 1.34.2'", "APP_ASSET_REVISION = '1.34.2'"]:
              if expected not in version:
                  raise SystemExit('Formal version mismatch: ' + expected)
          modal = Path('app/view/dashboard_modals.php').read_text(encoding='utf-8')
          if 'btn-close-white' in modal or 'data-bs-theme="dark"' not in modal:
              raise SystemExit('Bootstrap close-button migration not preserved.')
          print('Formalized files:')
          print('\n'.join(changed))
          PY
          git diff --check

      - name: Run formal V1.34.2 contracts
        run: |
          python3 tests/test_v1_34_2_a_modal_background.py
          python3 tests/test_v1_34_2_b_calendar_copy_contract.py
          node tests/test_v1_34_2_b_calendar_copy.js
          node --check public/js/calendar-copy.js
          python3 tests/test_v1_34_2_c_calendar_drag_drop_contract.py
          node tests/test_v1_34_2_c_calendar_drag_drop.js
          node --check public/js/calendar-drag-drop.js
          python3 tests/test_v1_34_2_d_card_mouse_wheel.py
          python3 tests/test_v1_34_2_e_release_readiness.py

      - name: Commit formal V1.34.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app public tests
          git diff --cached --check
          git diff --cached --quiet && { echo "No formalization changes"; exit 1; }
          git commit -m "V1.34.2: formalize release candidate [v1.34.2-formalized]"
          git push origin HEAD:release/v1.34.2

      - name: Build formal verification ZIP
        run: |
          zip -9 rss-reader-modernization-v1.34.2-formal-verification.zip \
            app/version.php \
            app/view/dashboard_modals.php \
            public/js/calendar.js \
            public/js/camera-video-streaming.js \
            public/js/rss-management.js
          unzip -t rss-reader-modernization-v1.34.2-formal-verification.zip
          sha256sum rss-reader-modernization-v1.34.2-formal-verification.zip

      - name: Upload formal verification ZIP
        uses: actions/upload-artifact@v4
        with:
          name: v1.34.2-formal-verification
          path: rss-reader-modernization-v1.34.2-formal-verification.zip
          if-no-files-found: error
