name: V1.34 combined regression diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: PHP 8.1 combined regression capture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capture combined regression failure
        shell: bash
        run: |
          set +e
          bash tests/run-current.sh > /tmp/run-current.log 2>&1
          rc_current=$?
          echo "run-current.sh rc=${rc_current}"
          if [ "${rc_current}" -ne 0 ]; then
            echo "--- run-current.sh tail ---"
            tail -n 80 /tmp/run-current.log
            exit "${rc_current}"
          fi

          bash tests/run-current-features.sh > /tmp/run-current-features.log 2>&1
          rc_features=$?
          echo "run-current-features.sh rc=${rc_features}"
          if [ "${rc_features}" -ne 0 ]; then
            echo "--- run-current-features.sh tail ---"
            tail -n 80 /tmp/run-current-features.log
            exit "${rc_features}"
          fi

          echo "Both current regression runners passed."
