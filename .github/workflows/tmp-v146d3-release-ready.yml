name: Temporary V1.46-D3 release-ready package

on:
  push:
    branches:
      - feature/v1.46-d3-final-cleanup-release

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Add temporary V1.46-D3 release-ready workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release-ready source
        run: python3 tools/check_release_ready.py --release 1.46.0

      - name: Build and verify final runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 tools/build_release_package.py --release 1.46.0 --mode final --output-dir dist
          python3 tools/verify_release_package.py --release 1.46.0             dist/rss-reader-modernization-1.46.0.zip             dist/rss-reader-modernization-1.46.0.zip.sha256

          unzip -Z1 dist/rss-reader-modernization-1.46.0.zip > /tmp/runtime-files.txt
          cat /tmp/runtime-files.txt

          for obsolete in             public/css/calendar-polish-r3.css             public/css/drawer-v121b.css             public/css/drawer-v121c.css             licenses/hls.js-1.6.16-Apache-2.0.txt             licenses/fontawesome-5.3.1-LICENSE.txt
          do
            if grep -Fxq "$obsolete" /tmp/runtime-files.txt; then
              echo "Obsolete file unexpectedly packaged: $obsolete" >&2
              exit 1
            fi
          done

          grep -Fxq "public/js/hls-1.7.3.min.js" /tmp/runtime-files.txt
          sha256sum public/js/hls-1.7.3.min.js
          cat dist/rss-reader-modernization-1.46.0.zip.sha256

      - name: Upload verification runtime
        uses: actions/upload-artifact@v4
        with:
          name: V1.46.0-release-ready-runtime
          path: |
            dist/rss-reader-modernization-1.46.0.zip
            dist/rss-reader-modernization-1.46.0.zip.sha256
          if-no-files-found: error
          retention-days: 7
