name: V1.14.1 Theme Round2 Audit

on:
  push:
    branches:
      - tmp/v1141-theme-round2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply remaining neutral theme alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              return text.replace(old, new, 1)

          p = Path('public/css/dashboard.css')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              '.task-card-body {\n    min-height: calc(13rem - 44px);\n    padding: 8px;\n    background: #fff;\n}',
              '.task-card-body {\n    min-height: calc(13rem - 44px);\n    padding: 8px;\n    background: var(--bs-body-bg, #fff);\n    color: var(--bs-body-color, #212529);\n}',
              'task body')
          s = one(s,
              '.task-item-create-form {\n    padding-top: 8px;\n    border-top: 1px solid rgba(0, 0, 0, 0.1);\n}',
              '.task-item-create-form {\n    padding-top: 8px;\n    border-top: 1px solid rgba(var(--bs-body-color-rgb, 33, 37, 41), 0.1);\n}',
              'task create border')

          s = s.replace('outline: 3px solid rgba(23, 162, 184, 0.42);', 'outline: 3px solid rgba(var(--bs-info-rgb, 23, 162, 184), 0.42);')
          s = one(s,
              '.feed-item-action:hover,\n.feed-item-action:focus {\n    background: rgba(0, 0, 0, 0.07);',
              '.feed-item-action:hover,\n.feed-item-action:focus {\n    background: rgba(var(--bs-body-color-rgb, 33, 37, 41), 0.07);',
              'feed action hover')

          s = s.replace('border: 1px solid rgba(23, 162, 184, 0.28);', 'border: 1px solid rgba(var(--bs-info-rgb, 23, 162, 184), 0.28);')
          s = s.replace('background: rgba(23, 162, 184, 0.08);', 'background: rgba(var(--bs-info-rgb, 23, 162, 184), 0.08);')
          s = s.replace('.stock-tag-chip > i {\n    color: #17a2b8;', '.stock-tag-chip > i {\n    color: var(--bs-info, #17a2b8);')
          s = s.replace('background: rgba(220, 53, 69, 0.1);\n    color: #dc3545;', 'background: rgba(var(--bs-danger-rgb, 220, 53, 69), 0.1);\n    color: var(--bs-danger, #dc3545);')
          s = s.replace('.stock-tag-editor-toggle:hover,\n.stock-tag-editor-toggle:focus {\n    color: #17a2b8;', '.stock-tag-editor-toggle:hover,\n.stock-tag-editor-toggle:focus {\n    color: var(--bs-link-color, #17a2b8);')
          s = one(s,
              '.stock-actions-trigger {\n    display: inline-flex;\n    width: 44px;\n    min-width: 44px;\n    height: 44px;\n    min-height: 44px;\n    padding: 0;\n    align-items: center;\n    justify-content: center;\n    color: #6c757d;',
              '.stock-actions-trigger {\n    display: inline-flex;\n    width: 44px;\n    min-width: 44px;\n    height: 44px;\n    min-height: 44px;\n    padding: 0;\n    align-items: center;\n    justify-content: center;\n    color: var(--bs-secondary-color, #6c757d);',
              'stock action base')
          s = one(s,
              '.stock-actions-trigger:hover,\n.stock-actions-trigger:focus {\n    color: #17a2b8;',
              '.stock-actions-trigger:hover,\n.stock-actions-trigger:focus {\n    color: var(--bs-link-color, #17a2b8);',
              'stock action hover')
          s = one(s, 'border: 1px dashed #adb5bd;', 'border: 1px dashed var(--bs-border-color, #adb5bd);', 'empty state border')

          s = one(s,
              '.calendar-day-today {\n    box-shadow: inset 0 0 0 2px #17a2b8;\n}',
              '.calendar-day-today {\n    box-shadow: inset 0 0 0 2px var(--bs-info, #17a2b8);\n}',
              'calendar today')
          s = one(s,
              '.calendar-day-number:hover,\n.calendar-day-number:focus {\n    background: rgba(23, 162, 184, 0.14);',
              '.calendar-day-number:hover,\n.calendar-day-number:focus {\n    background: rgba(var(--bs-info-rgb, 23, 162, 184), 0.14);',
              'calendar day hover')

          s = one(s,
              '    .feed-item-summary-icon {\n        color: #6c757d;\n        -webkit-text-fill-color: #6c757d;',
              '    .feed-item-summary-icon {\n        color: var(--bs-secondary-color, #6c757d);\n        -webkit-text-fill-color: var(--bs-secondary-color, #6c757d);',
              'mobile summary icon')
          s = one(s,
              '    .feed-item-summary-toggle:disabled .feed-item-summary-icon {\n        color: #adb5bd;\n        -webkit-text-fill-color: #adb5bd;',
              '    .feed-item-summary-toggle:disabled .feed-item-summary-icon {\n        color: var(--bs-secondary-color, #adb5bd);\n        -webkit-text-fill-color: var(--bs-secondary-color, #adb5bd);',
              'mobile disabled summary icon')
          p.write_text(s, encoding='utf-8')

          p = Path('public/css/mini-game.css')
          s = p.read_text(encoding='utf-8')
          s = one(s,
              '.mini-game-cell:focus,.mini-game-cell:focus-visible,.mini-game-reset:focus,.mini-game-reset:focus-visible,.mini-game-new-game:focus,.mini-game-new-game:focus-visible,.mini-game-direction:focus,.mini-game-direction:focus-visible,.mini-game-tutorial-toggle:focus,.mini-game-tutorial-toggle:focus-visible,.mini-game-storage-reset:focus,.mini-game-storage-reset:focus-visible { outline: 3px solid #0b5ed7; outline-offset: 2px; }',
              '.mini-game-cell:focus,.mini-game-cell:focus-visible,.mini-game-reset:focus,.mini-game-reset:focus-visible,.mini-game-new-game:focus,.mini-game-new-game:focus-visible,.mini-game-direction:focus,.mini-game-direction:focus-visible,.mini-game-tutorial-toggle:focus,.mini-game-tutorial-toggle:focus-visible,.mini-game-storage-reset:focus,.mini-game-storage-reset:focus-visible { outline: 3px solid var(--bs-primary,#0b5ed7); outline-offset: 2px; }',
              'game focus')
          s = one(s,
              '.mini-game-cell-wall { background: rgba(52,58,64,.22); color: #495057; }',
              '.mini-game-cell-wall { background: rgba(var(--bs-body-color-rgb,33,37,41),.22); color: var(--bs-secondary-color,#495057); }',
              'game wall')
          s = one(s,
              '.mini-game-storage-note { width: min(100%,232px); margin: .4rem 0 0; font-size: .7rem; }',
              '.mini-game-storage-note { width: min(100%,232px); margin: .4rem 0 0; color: var(--bs-secondary-color,#6c757d); font-size: .7rem; }',
              'game storage note')

          for old in [
              '#main-content[data-dashboard-theme="bootstrap-solar"] .mini-game-card-inner,#main-content[data-dashboard-theme="bootstrap-slate"] .mini-game-card-inner { background: #2b3035; color: #f8f9fa; border-color: rgba(255,255,255,.18); }\n',
              '#main-content[data-dashboard-theme="bootstrap-solar"] .mini-game-summary-label,#main-content[data-dashboard-theme="bootstrap-slate"] .mini-game-summary-label,#main-content[data-dashboard-theme="bootstrap-solar"] .mini-game-storage-note,#main-content[data-dashboard-theme="bootstrap-slate"] .mini-game-storage-note { color: #ced4da !important; }\n',
              '#main-content[data-dashboard-theme="bootstrap-solar"] .mini-game-cell,#main-content[data-dashboard-theme="bootstrap-slate"] .mini-game-cell { background: rgba(255,255,255,.1); color: #f8f9fa; border-color: rgba(255,255,255,.3); }\n',
              '#main-content[data-dashboard-theme="bootstrap-solar"] .mini-game-cell-wall,#main-content[data-dashboard-theme="bootstrap-slate"] .mini-game-cell-wall { background: rgba(0,0,0,.35); color: #dee2e6; }\n',
              '#main-content[data-dashboard-theme="bootstrap-solar"] .mini-game-tutorial,#main-content[data-dashboard-theme="bootstrap-slate"] .mini-game-tutorial { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.2); }\n',
          ]:
              if old not in s:
                  raise SystemExit('expected neutral game override missing')
              s = s.replace(old, '', 1)

          s = one(s,
              '.lights-out-cell { position: relative; overflow: hidden; background: rgba(33,37,41,.12); }',
              '.lights-out-cell { position: relative; overflow: hidden; background: rgba(var(--bs-body-color-rgb,33,37,41),.12); }',
              'lights off cell')
          s = one(s,
              ".lights-out-cell::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: rgba(108,117,125,.28); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }",
              ".lights-out-cell::before { content: ''; width: 18px; height: 18px; border-radius: 50%; background: rgba(var(--bs-body-color-rgb,33,37,41),.28); box-shadow: inset 0 0 0 1px rgba(var(--bs-body-color-rgb,33,37,41),.12); }",
              'lights off dot')
          for old in [
              '#main-content[data-dashboard-theme="bootstrap-solar"] .lights-out-cell,#main-content[data-dashboard-theme="bootstrap-slate"] .lights-out-cell { background: rgba(255,255,255,.08); }\n',
              '#main-content[data-dashboard-theme="bootstrap-solar"] .lights-out-cell::before,#main-content[data-dashboard-theme="bootstrap-slate"] .lights-out-cell::before { background: rgba(222,226,230,.3); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }\n',
          ]:
              if old not in s:
                  raise SystemExit('expected Lights Out neutral override missing')
              s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate remaining neutral theme alignment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          d = Path('public/css/dashboard.css').read_text(encoding='utf-8')
          g = Path('public/css/mini-game.css').read_text(encoding='utf-8')

          required = [
              'background: var(--bs-body-bg, #fff);\n    color: var(--bs-body-color, #212529);',
              '-webkit-text-fill-color: var(--bs-secondary-color, #6c757d);',
              'rgba(var(--bs-info-rgb, 23, 162, 184), 0.28)',
              'rgba(var(--bs-danger-rgb, 220, 53, 69), 0.1)',
              'border: 1px dashed var(--bs-border-color, #adb5bd);',
              'box-shadow: inset 0 0 0 2px var(--bs-info, #17a2b8);',
          ]
          for marker in required:
              if marker not in d:
                  raise SystemExit('missing dashboard marker: ' + marker)

          game_required = [
              'outline: 3px solid var(--bs-primary,#0b5ed7)',
              'color: var(--bs-secondary-color,#495057)',
              'color: var(--bs-secondary-color,#6c757d); font-size: .7rem;',
              'background: rgba(var(--bs-body-color-rgb,33,37,41),.12);',
          ]
          for marker in game_required:
              if marker not in g:
                  raise SystemExit('missing game marker: ' + marker)

          for forbidden in [
              '.mini-game-card-inner { background: #2b3035',
              '.mini-game-cell { background: rgba(255,255,255,.1)',
              '.mini-game-cell-wall { background: rgba(0,0,0,.35)',
              '.mini-game-tutorial { background: rgba(255,255,255,.06)',
          ]:
              if forbidden in g:
                  raise SystemExit('neutral dark-theme override remained: ' + forbidden)

          # Semantic gameplay colors must remain explicit and recognizable.
          for selector in [
              '.mini-game-cell-player', '.mini-game-cell-enemy', '.mini-game-cell-treasure',
              '.mini-game-cell-goal', '.mini-game-result-won', '.mini-game-result-lost',
              '.lights-out-cell-on',
          ]:
              if selector not in g:
                  raise SystemExit('semantic game selector missing: ' + selector)
          print('theme round2 markers OK')
          PY

          for css in public/css/bootstrap-5.3.8.min.css public/css/bootstrap-*-5.3.8.min.css; do
            for var in --bs-body-bg --bs-body-color --bs-body-color-rgb --bs-secondary-color --bs-link-color --bs-primary --bs-info --bs-info-rgb --bs-danger --bs-danger-rgb --bs-border-color; do
              grep -Fq -- "${var}" "${css}"
            done
          done

      - name: Focused regressions and CSS sanity
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_v12c_r5_title_color.py
          python tests/test_v12d_article_actions.py
          python tests/test_v14b_architecture.py
          python tests/test_v15b_architecture.py || true
          python tests/test_v16c_architecture.py
          python - <<'PY'
          from pathlib import Path
          for name in ['dashboard.css','utility-widgets.css','mail-widget.css','clock-timer.css','mini-game.css']:
              p = Path('public/css') / name
              s = p.read_text(encoding='utf-8')
              if s.count('{') != s.count('}'):
                  raise SystemExit(f'unbalanced braces: {name}')
          PY
          git diff --check

      - name: Upload exact CSS candidate
        uses: actions/upload-artifact@v4
        with:
          name: v1.14.1-theme-round2-css
          path: |
            public/css/dashboard.css
            public/css/utility-widgets.css
            public/css/mail-widget.css
            public/css/clock-timer.css
            public/css/mini-game.css
          if-no-files-found: error
