name: V1.20.1 temporary source reconstruction gate

on:
  pull_request:
    branches:
      - staging/v1.20.1-reconstruct-base
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: v1.20.1-temporary-source-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    if: github.head_ref == 'release/v1.20.1-final-clean'
    name: Verify and reconstruct final V1.20.1 source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.20.1-final-clean
          fetch-depth: 0

      - name: Reconstruct and verify final source patch
        shell: bash
        run: |
          set -euo pipefail

          staging='.release-staging/v1201'
          manifest="$staging/manifest.tsv"
          patch_b64='/tmp/v1201-final.patch.b64'
          patch_xz='/tmp/v1201-final.patch.xz'
          patch='/tmp/v1201-final.patch'

          test -f "$manifest"
          test "$(wc -l < "$manifest")" -eq 47

          : > "$patch_b64"
          for n in 000 001 002 003; do
            chunk="$staging/chunks/${n}.b64"
            test -f "$chunk"
            cat "$chunk" >> "$patch_b64"
          done

          base64 --decode "$patch_b64" > "$patch_xz"
          echo '488c2ec7a679cecec0107cc66eae4e9d968104a87ee39f00a1d4e386410be6ba  /tmp/v1201-final.patch.xz' | sha256sum -c -
          xz -dc "$patch_xz" > "$patch"

          git apply -p2 --check "$patch"
          git apply -p2 "$patch"

          while IFS=$'\t' read -r expected path; do
            test -n "$expected"
            test -n "$path"
            test -f "$path"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Blob mismatch after patch: $path expected=$expected actual=$actual" >&2
              exit 1
            fi
          done < "$manifest"

      - name: Commit verified final source to release branch
        shell: bash
        run: |
          set -euo pipefail

          cut -f2 .release-staging/v1201/manifest.tsv > /tmp/v1201-paths
          rm -rf .release-staging/v1201

          git add --pathspec-from-file=/tmp/v1201-paths
          git rm -r --ignore-unmatch -- .release-staging/v1201

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git status --short
          git commit -m 'Prepare RSS Reader Modernization 1.20.1 release source'
          git push origin HEAD:release/v1.20.1-final-clean
