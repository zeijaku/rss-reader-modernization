name: V1.16 Release Finalize

on:
  push:
    branches:
      - release/v1.16.0-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.16.0-finalize
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize release files
        run: python tools/v116_finalize_release.py

      - name: Validate release metadata and package tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/build_release_package.py tools/verify_release_package.py tools/build_complete_package.py tools/verify_complete_package.py
          grep -Fq "INTENDED_RELEASE = '1.16.0'" tools/build_release_package.py
          grep -Fq "VERSION = '1.16.0'" tools/build_complete_package.py
          grep -Fq "const APP_VERSION = '1.16.0';" app/version.php
          grep -Fq '**Stable release:** `RSS Reader Modernization 1.16.0`' README.md
          grep -Fq '## RSS Reader Modernization 1.16.0 — 2026-08-17' CHANGELOG.md
          grep -Fq '# RSS Reader Modernization 1.16.0 Release Notes' RELEASE_NOTES.md
          git diff --check

      - name: Commit formal release metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v1.16-finalize.yml tools/v116_finalize_release.py
          git add README.md CHANGELOG.md RELEASE_NOTES.md \
            tools/build_release_package.py tools/verify_release_package.py \
            tools/build_complete_package.py tools/verify_complete_package.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: finalize Version 1.16.0 metadata'
          git push origin HEAD:release/v1.16.0-finalize
