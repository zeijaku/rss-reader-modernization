name: V1.32 Atomic Assemble
# binary-sha-gate

on:
  push:
    branches:
      - release/v1.32.0-atomic
    paths:
      - '.github/workflows/v1.32-atomic-assemble.yml'

permissions:
  contents: write

concurrency:
  group: v132-atomic-assemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout atomic release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and verify V1.32 payload
        shell: bash
        run: |
          set -euo pipefail
          B64_FILE="${RUNNER_TEMP}/v132-atomic.tar.xz.b64"
          XZ_FILE="${RUNNER_TEMP}/v132-atomic.tar.xz"

          cat \
            .github/v132-atomic/part_00 \
            .github/v132-atomic/part_01 \
            .github/v132-atomic/part_02 \
            .github/v132-atomic/part_03 \
            .github/v132-atomic/part_04 \
            .github/v132-atomic/part_05a \
            .github/v132-atomic/part_05b \
            .github/v132-atomic/part_06a \
            .github/v132-atomic/part_06b \
            .github/v132-atomic/part_07a \
            .github/v132-atomic/part_07b \
            .github/v132-atomic/part_08a \
            .github/v132-atomic/part_08b \
            .github/v132-atomic/part_09a \
            .github/v132-atomic/part_09b \
            .github/v132-atomic/part_10a \
            .github/v132-atomic/part_10b \
            .github/v132-atomic/part_11a \
            .github/v132-atomic/part_11b \
            .github/v132-atomic/part_12a0 \
            .github/v132-atomic/part_12a1 \
            .github/v132-atomic/part_12a2 \
            .github/v132-atomic/part_12a3 \
            .github/v132-atomic/part_12b0 \
            .github/v132-atomic/part_12b1 \
            .github/v132-atomic/part_12b2 \
            .github/v132-atomic/part_12b3 \
            .github/v132-atomic/part_13a0 \
            .github/v132-atomic/part_13a1 \
            .github/v132-atomic/part_13a2 \
            .github/v132-atomic/part_13b0 \
            .github/v132-atomic/part_13b1 \
            .github/v132-atomic/part_13b2 \
            > "${B64_FILE}"

          EXPECTED_B64_SHA='bc5c4be7243e20b233b3b6fa82cb182b294e383e22e20b3d2ac19ced774b10c3'
          ACTUAL_B64_SHA="$(sha256sum "${B64_FILE}" | awk '{print $1}')"
          echo "B64 SHA actual=${ACTUAL_B64_SHA} expected=${EXPECTED_B64_SHA}"
          if [ "${ACTUAL_B64_SHA}" != "${EXPECTED_B64_SHA}" ]; then
            echo 'Base64 text representation differs; continuing to the authoritative decoded-binary SHA-256 gate.'
          fi

          base64 --decode "${B64_FILE}" > "${XZ_FILE}"
          EXPECTED_XZ_SHA='276a4c5e55152daa47be1c16e5cbad9da07b8b61834e78a897febe7de7d5f0bd'
          ACTUAL_XZ_SHA="$(sha256sum "${XZ_FILE}" | awk '{print $1}')"
          echo "XZ SHA actual=${ACTUAL_XZ_SHA} expected=${EXPECTED_XZ_SHA}"
          if [ "${ACTUAL_XZ_SHA}" != "${EXPECTED_XZ_SHA}" ]; then
            echo 'V1.32 atomic tar.xz payload mismatch.' >&2
            exit 1
          fi

          echo 'Checking xz stream and tar archive.'
          xz -t "${XZ_FILE}"
          tar -tJf "${XZ_FILE}" >/dev/null
          tar -xJf "${XZ_FILE}" -C .

          printf '1.32.0\n' > .github/release-request.txt
          rm -rf .github/v132-atomic
          rm -f .github/workflows/v1.32-atomic-assemble.yml

          echo 'Checking final version contracts.'
          grep -Fq "const APP_VERSION = '1.32.0';" app/version.php || { echo 'APP_VERSION contract failed.' >&2; exit 1; }
          grep -Fq "const APP_ASSET_REVISION = '1.32.0';" app/version.php || { echo 'APP_ASSET_REVISION contract failed.' >&2; exit 1; }
          test "$(tr -d '[:space:]' < .github/release-request.txt)" = '1.32.0' || { echo 'release-request contract failed.' >&2; exit 1; }
          echo 'V1.32 payload verification complete.'

      - name: Commit assembled V1.32.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No assembled source changes found.' >&2
            exit 1
          fi
          git commit -m 'Assemble V1.32.0 release source'
          git push origin HEAD:release/v1.32.0-atomic
