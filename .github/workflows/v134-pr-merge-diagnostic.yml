name: V1.34 PR merge diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolate:
    name: PHP 8.1 PR merge isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: run-current.sh
        continue-on-error: true
        run: bash tests/run-current.sh

      - name: run-current-features.sh
        continue-on-error: true
        run: bash tests/run-current-features.sh
