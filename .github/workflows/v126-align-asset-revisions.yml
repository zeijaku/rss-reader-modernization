name: V1.26 Align Asset Revisions

on:
  push:
    branches:
      - feature/v1.26-information-board
    paths:
      - '.github/workflows/v126-align-asset-revisions.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.26-information-board
          fetch-depth: 0

      - name: Align dynamic asset revisions with V1.26.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('public/js/calendar.js'),
              Path('public/js/camera-video-streaming.js'),
          ]
          old = '?v=1.25.0'
          new = '?v=1.26.0'
          total = 0
          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count:
                  path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {count} replacement(s)')
              total += count
          if total == 0:
              raise SystemExit('No V1.25.0 dynamic asset revisions found to promote.')
          PY

      - name: Commit aligned asset revisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/js/calendar.js public/js/camera-video-streaming.js
          git commit -m 'V1.26: align dynamic asset cache revisions'
          git push origin HEAD:feature/v1.26-information-board
