name: V1.16 Candidate CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v116-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} V1.16 candidate regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Apply exact V1.16 candidate overlay
        shell: bash
        run: |
          base64 --decode .github/v116-candidate-overlay.zip.b64 > /tmp/v116-candidate-overlay.zip
          echo "95eb7751b1b342f476baf2df7c780343204b5f1379c0e0ac22df986640d35d23  /tmp/v116-candidate-overlay.zip" | sha256sum -c -
          unzip -o /tmp/v116-candidate-overlay.zip -d .
          rm -f /tmp/v116-candidate-overlay.zip

      - name: Candidate syntax and contract
        shell: bash
        run: |
          php -l app/version.php
          php -l app/dashboard_widget.php
          php -l app/api.php
          php -l app/search_feed.php
          php -l config/common_feeds.php
          node --check public/js/clock-timer.js
          python tests/test_v116_candidate.py

      - name: Run full regression
        run: bash tests/run.sh
