name: V1.16 Candidate CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v116-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} V1.16 candidate regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show runtime versions
        run: |
          php -v
          python --version
          node --version

      - name: Apply exact V1.16 candidate overlay
        shell: bash
        run: |
          cat \
            .github/v116-overlay-parts/part00.b64 \
            .github/v116-overlay-parts/part01.b64 \
            .github/v116-overlay-parts/part02.b64 \
            .github/v116-overlay-parts/part03.b64 \
            .github/v116-overlay-parts/part04.b64 \
            .github/v116-overlay-parts/part05.b64 \
            | base64 --decode > /tmp/v116-candidate-overlay.zip
          echo "95eb7751b1b342f476baf2df7c780343204b5f1379c0e0ac22df986640d35d23  /tmp/v116-candidate-overlay.zip" | sha256sum -c -
          unzip -o /tmp/v116-candidate-overlay.zip -d .
          rm -f /tmp/v116-candidate-overlay.zip

      - name: Candidate syntax and contract
        shell: bash
        run: |
          php -l app/version.php
          php -l app/dashboard_widget.php
          php -l app/api.php
          php -l app/search_feed.php
          php -l config/common_feeds.php
          node --check public/js/clock-timer.js
          python tests/test_v116_candidate.py

      - name: Run full regression
        shell: bash
        run: |
          set +e
          bash tests/run.sh 2>&1 | tee /tmp/v116-regression-php-${{ matrix.php }}.log
          status=${PIPESTATUS[0]}
          echo "Regression exit status: ${status}"
          echo "--- Failure-oriented tail ---"
          grep -E '(^|[^A-Z])(FAIL|ERROR|Traceback|Assertion|RESULT:|FAILED|Fatal error|Parse error)' /tmp/v116-regression-php-${{ matrix.php }}.log | tail -n 250 || true
          exit "${status}"

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v116-regression-php-${{ matrix.php }}
          path: /tmp/v116-regression-php-${{ matrix.php }}.log
          if-no-files-found: error
          retention-days: 1
