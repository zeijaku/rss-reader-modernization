name: V1.16 Candidate CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v116-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: PHP ${{ matrix.php }} V1.16 final regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply exact V1.16 final tree
        shell: bash
        run: |
          set -eu
          cat \
            .github/v116-overlay-parts/part00.b64 \
            .github/v116-overlay-parts/part01.b64 \
            .github/v116-overlay-parts/part02.b64 \
            .github/v116-overlay-parts/part03.b64 \
            .github/v116-overlay-parts/part04.b64 \
            .github/v116-overlay-parts/part05.b64 \
            | base64 --decode > /tmp/v116-candidate-overlay.zip
          echo "95eb7751b1b342f476baf2df7c780343204b5f1379c0e0ac22df986640d35d23  /tmp/v116-candidate-overlay.zip" | sha256sum -c -
          unzip -o /tmp/v116-candidate-overlay.zip -d .
          rm -f /tmp/v116-candidate-overlay.zip
          python - <<'PY'
          from pathlib import Path

          js = Path('public/js/clock-timer.js')
          source = js.read_text(encoding='utf-8')
          calculator_old = """(function ($, window, document) {\n    'use strict';\n\n    var namespace = '.iguguruCalculatorWidget';"""
          calculator_new = """(function ($, window, document) {\n    'use strict';\n\n    if (!$) {\n        return;\n    }\n\n    var namespace = '.iguguruCalculatorWidget';"""
          blind_old = """}(jQuery, window, document));\n\n/* V1.16-B Blind Spot / Discovery Widget. Feed transport stays on the existing server-side safe fetch path. */\n(function ($, window, document) {\n    'use strict';\n\n    var namespace = '.iguguruBlindSpotWidget';"""
          blind_new = """}(typeof window.jQuery === 'function' ? window.jQuery : null, window, document));\n\n/* V1.16-B Blind Spot / Discovery Widget. Feed transport stays on the existing server-side safe fetch path. */\n(function ($, window, document) {\n    'use strict';\n\n    if (!$) {\n        return;\n    }\n\n    var namespace = '.iguguruBlindSpotWidget';"""
          if calculator_old not in source or blind_old not in source:
              raise SystemExit('V1.16 jQuery guard patch target not found')
          source = source.replace(calculator_old, calculator_new, 1)
          source = source.replace(blind_old, blind_new, 1)
          final_old = '}(jQuery, window, document));\n'
          final_new = "}(typeof window.jQuery === 'function' ? window.jQuery : null, window, document));\n"
          if final_old not in source:
              raise SystemExit('Blind Spot jQuery invocation target not found')
          source = source.replace(final_old, final_new, 1)
          js.write_text(source, encoding='utf-8')

          candidate = Path('tests/test_v116_candidate.py')
          release = Path('tests/test_v116_release.py')
          release.write_text(
              candidate.read_text(encoding='utf-8').replace('candidate', 'release').replace('Candidate', 'Release'),
              encoding='utf-8'
          )
          candidate.unlink()

          run = Path('tests/run.sh')
          run_source = run.read_text(encoding='utf-8')
          marker = 'tests/test_v116_release.py'
          if marker not in run_source:
              if not run_source.endswith('\n'):
                  run_source += '\n'
              run_source += "\necho '== V1.16 Calculator / Blind Spot / UI regression checks =='\n"
              run_source += 'python3 "$ROOT/tests/test_v116_release.py"\n'
              run.write_text(run_source, encoding='utf-8')
          PY

      - name: V1.16 syntax and contract
        shell: bash
        run: |
          php -l app/version.php
          php -l app/dashboard_widget.php
          php -l app/api.php
          php -l app/search_feed.php
          php -l config/common_feeds.php
          node --check public/js/clock-timer.js
          python tests/test_v116_release.py
          test "$(grep -cF '}(jQuery, window, document));' public/js/clock-timer.js || true)" = "0"
          test "$(grep -cF 'if (!$) {' public/js/clock-timer.js)" -ge "2"
          test "$(grep -cF "typeof window.jQuery === 'function' ? window.jQuery : null" public/js/clock-timer.js)" -ge "2"

      - name: Run full regression
        run: bash tests/run.sh

  promote:
    name: Promote validated V1.16 tree to candidate branch
    needs: regression
    if: github.event_name == 'pull_request' && github.head_ref == 'release/v1.16.0-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.16.0-candidate
          fetch-depth: 0

      - name: Build exact validated V1.16 tree
        shell: bash
        run: |
          set -eu
          cat \
            .github/v116-overlay-parts/part00.b64 \
            .github/v116-overlay-parts/part01.b64 \
            .github/v116-overlay-parts/part02.b64 \
            .github/v116-overlay-parts/part03.b64 \
            .github/v116-overlay-parts/part04.b64 \
            .github/v116-overlay-parts/part05.b64 \
            | base64 --decode > /tmp/v116-candidate-overlay.zip
          echo "95eb7751b1b342f476baf2df7c780343204b5f1379c0e0ac22df986640d35d23  /tmp/v116-candidate-overlay.zip" | sha256sum -c -
          unzip -o /tmp/v116-candidate-overlay.zip -d .
          rm -f /tmp/v116-candidate-overlay.zip
          python - <<'PY'
          from pathlib import Path

          js = Path('public/js/clock-timer.js')
          source = js.read_text(encoding='utf-8')
          calculator_old = """(function ($, window, document) {\n    'use strict';\n\n    var namespace = '.iguguruCalculatorWidget';"""
          calculator_new = """(function ($, window, document) {\n    'use strict';\n\n    if (!$) {\n        return;\n    }\n\n    var namespace = '.iguguruCalculatorWidget';"""
          blind_old = """}(jQuery, window, document));\n\n/* V1.16-B Blind Spot / Discovery Widget. Feed transport stays on the existing server-side safe fetch path. */\n(function ($, window, document) {\n    'use strict';\n\n    var namespace = '.iguguruBlindSpotWidget';"""
          blind_new = """}(typeof window.jQuery === 'function' ? window.jQuery : null, window, document));\n\n/* V1.16-B Blind Spot / Discovery Widget. Feed transport stays on the existing server-side safe fetch path. */\n(function ($, window, document) {\n    'use strict';\n\n    if (!$) {\n        return;\n    }\n\n    var namespace = '.iguguruBlindSpotWidget';"""
          if calculator_old not in source or blind_old not in source:
              raise SystemExit('V1.16 jQuery guard patch target not found')
          source = source.replace(calculator_old, calculator_new, 1)
          source = source.replace(blind_old, blind_new, 1)
          final_old = '}(jQuery, window, document));\n'
          final_new = "}(typeof window.jQuery === 'function' ? window.jQuery : null, window, document));\n"
          if final_old not in source:
              raise SystemExit('Blind Spot jQuery invocation target not found')
          source = source.replace(final_old, final_new, 1)
          js.write_text(source, encoding='utf-8')

          candidate = Path('tests/test_v116_candidate.py')
          release = Path('tests/test_v116_release.py')
          release.write_text(
              candidate.read_text(encoding='utf-8').replace('candidate', 'release').replace('Candidate', 'Release'),
              encoding='utf-8'
          )
          candidate.unlink()

          run = Path('tests/run.sh')
          run_source = run.read_text(encoding='utf-8')
          if 'tests/test_v116_release.py' not in run_source:
              if not run_source.endswith('\n'):
                  run_source += '\n'
              run_source += "\necho '== V1.16 Calculator / Blind Spot / UI regression checks =='\n"
              run_source += 'python3 "$ROOT/tests/test_v116_release.py"\n'
              run.write_text(run_source, encoding='utf-8')
          PY

      - name: Stage only formal V1.16 files
        shell: bash
        run: |
          set -eu
          git add \
            app/version.php \
            app/dashboard_widget.php \
            app/api.php \
            app/search_feed.php \
            config/common_feeds.php \
            public/js/clock-timer.js \
            tests/run.sh \
            tests/test_v116_release.py
          git rm -f \
            .github/v116-candidate-overlay.zip.b64 \
            .github/v116-overlay-parts/part00.b64 \
            .github/v116-overlay-parts/part01.b64 \
            .github/v116-overlay-parts/part02.b64 \
            .github/v116-overlay-parts/part03.b64 \
            .github/v116-overlay-parts/part04.b64 \
            .github/v116-overlay-parts/part05.b64 \
            .github/workflows/v1.16-candidate-ci.yml
          git diff --cached --check
          git diff --cached --name-status
          python - <<'PY'
          import subprocess
          expected = {
              '.github/v116-candidate-overlay.zip.b64',
              '.github/v116-overlay-parts/part00.b64',
              '.github/v116-overlay-parts/part01.b64',
              '.github/v116-overlay-parts/part02.b64',
              '.github/v116-overlay-parts/part03.b64',
              '.github/v116-overlay-parts/part04.b64',
              '.github/v116-overlay-parts/part05.b64',
              '.github/workflows/v1.16-candidate-ci.yml',
              'app/version.php',
              'app/dashboard_widget.php',
              'app/api.php',
              'app/search_feed.php',
              'config/common_feeds.php',
              'public/js/clock-timer.js',
              'tests/run.sh',
              'tests/test_v116_release.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected staged paths: {sorted(actual ^ expected)}')
          PY

      - name: Commit and push formal candidate
        shell: bash
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: prepare Version 1.16.0'
          git push origin HEAD:release/v1.16.0-candidate
