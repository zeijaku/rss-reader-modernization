name: V1.34 Release Sync Inspect

on:
  push:
    branches:
      - release/v1.34.0
    paths:
      - '.github/workflows/release-sync-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode staged payload safely
        shell: bash
        run: |
          set -euo pipefail
          cat .release-sync/part-* | tr -d '\r\n' | base64 --decode > /tmp/v134.tar.gz
          gzip -t /tmp/v134.tar.gz
          tar -tzf /tmp/v134.tar.gz | tee /tmp/archive-list.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/archive-list.txt; then
            echo 'Unsafe archive path found' >&2
            exit 1
          fi
          echo "Archive entries: $(wc -l < /tmp/archive-list.txt)"
