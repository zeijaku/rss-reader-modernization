name: V1.39-C Verification Overlay

on:
  push:
    branches:
      - feature/v1.39-c-php-architecture-security

permissions:
  contents: read

jobs:
  package-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare overlay
        run: |
          set -euo pipefail
          mkdir -p overlay/app/api/content overlay/app/reader/full_text
          cp app/api/content.php overlay/app/api/content.php
          cp app/api/content/content_actions.php overlay/app/api/content/content_actions.php
          cp app/api/content/stock_actions.php overlay/app/api/content/stock_actions.php
          cp app/api/content/feed_actions.php overlay/app/api/content/feed_actions.php
          cp app/api/content/reader_actions.php overlay/app/api/content/reader_actions.php
          cp app/reader/reader_full_text.php overlay/app/reader/reader_full_text.php
          cp app/reader/full_text/request.php overlay/app/reader/full_text/request.php
          cp app/reader/full_text/charset.php overlay/app/reader/full_text/charset.php
          cp app/reader/full_text/extraction.php overlay/app/reader/full_text/extraction.php
          cp app/reader/full_text/cache.php overlay/app/reader/full_text/cache.php
          cp app/reader/full_text/service.php overlay/app/reader/full_text/service.php
          find overlay -type f -print | sort
      - name: Upload overlay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v1.39-c-php-architecture-overlay
          path: overlay/
          if-no-files-found: error
