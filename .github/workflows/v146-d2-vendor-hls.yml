name: V1.46-D2 vendor hls.js

on:
  push:
    branches:
      - feature/v1.46-d2-dependency-css
    paths:
      - .github/workflows/v146-d2-vendor-hls.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.46-d2-dependency-css
      - name: Download official hls.js v1.7.3 release
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          curl --fail --location --retry 3             https://github.com/video-dev/hls.js/releases/download/v1.7.3/release.zip             --output "$work/release.zip"
          unzip -q "$work/release.zip" -d "$work/release"
          echo "Release artifact files:"
          find "$work/release" -maxdepth 3 -type f -printf '%P\n' | sort | head -80
          source_file="$(find "$work/release" -type f -name 'hls.min.js' -print -quit)"
          test -n "$source_file"
          test -s "$source_file"
          grep -q '1\.7\.3' "$source_file"
          cp "$source_file" public/js/hls-1.7.3.min.js
          curl --fail --location --retry 3             https://raw.githubusercontent.com/video-dev/hls.js/v1.7.3/LICENSE             --output licenses/hls.js-1.7.3-Apache-2.0.txt
          grep -q 'Apache License' licenses/hls.js-1.7.3-Apache-2.0.txt
          echo "hls.js:"
          sha256sum public/js/hls-1.7.3.min.js
          echo "license:"
          sha256sum licenses/hls.js-1.7.3-Apache-2.0.txt
          wc -c public/js/hls-1.7.3.min.js licenses/hls.js-1.7.3-Apache-2.0.txt
      - name: Commit vendored official artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/hls-1.7.3.min.js licenses/hls.js-1.7.3-Apache-2.0.txt
          git diff --cached --check
          git commit -m "Vendor hls.js 1.7.3 official release artifacts"
          git push origin HEAD:feature/v1.46-d2-dependency-css
