name: V1.16 Release Gate

on:
  push:
    branches:
      - release/v1.16.0-publish

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.16.0-publish
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final release gate fixes
        run: python tools/v116_release_gate.py

      - name: Remove temporary release-gate files from package tree
        run: git rm .github/workflows/v1.16-release-gate.yml tools/v116_release_gate.py

      - name: Build and verify Runtime and Complete packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-output"
          python tools/build_release_package.py --mode final --output-dir "$RUNNER_TEMP/release-output"
          python tools/verify_release_package.py \
            "$RUNNER_TEMP/release-output/rss-reader-modernization-1.16.0.zip" \
            "$RUNNER_TEMP/release-output/rss-reader-modernization-1.16.0.zip.sha256"
          python tools/build_complete_package.py --output-dir "$RUNNER_TEMP/release-output"
          python tools/verify_complete_package.py \
            "$RUNNER_TEMP/release-output/rss-reader-modernization-1.16.0-complete.zip" \
            "$RUNNER_TEMP/release-output/rss-reader-modernization-1.16.0-complete.zip.sha256"

      - name: Build and verify Production Update package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, zipfile

          root = Path('.')
          out = Path.home() / 'release-output-unused'
          target = Path(__import__('os').environ['RUNNER_TEMP']) / 'release-output'
          target.mkdir(parents=True, exist_ok=True)
          files = [
              Path('app/version.php'),
              Path('app/dashboard_widget.php'),
              Path('app/api.php'),
              Path('app/search_feed.php'),
              Path('config/common_feeds.php'),
              Path('public/js/clock-timer.js'),
          ]
          zip_path = target / 'rss-reader-modernization-1.16.0-production-update.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for rel in sorted(files, key=lambda p: p.as_posix()):
                  info = zipfile.ZipInfo(rel.as_posix(), (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  zf.writestr(info, (root / rel).read_bytes())
          digest = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          sidecar = target / (zip_path.name + '.sha256')
          sidecar.write_text(f'{digest}  {zip_path.name}\n', encoding='ascii', newline='\n')
          with zipfile.ZipFile(zip_path) as zf:
              names = zf.namelist()
              expected = sorted(p.as_posix() for p in files)
              assert names == expected
              assert zf.testzip() is None
              assert len(names) == len(set(names))
              assert all(not PurePosixPath(n).is_absolute() and '..' not in PurePosixPath(n).parts and '\\' not in n for n in names)
              for rel in files:
                  assert zf.read(rel.as_posix()) == (root / rel).read_bytes()
          side = sidecar.read_text(encoding='ascii').strip().split('  ', 1)
          assert side == [digest, zip_path.name]
          print('Production Update:', zip_path)
          print('SHA-256:', digest)
          PY

      - name: Validate final release tree
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const APP_VERSION = '1.16.0';" app/version.php
          grep -Fq '## Verification limits' RELEASE_NOTES.md
          python - <<'PY'
          from pathlib import Path
          for rel in ('tools/build_release_package.py', 'tools/verify_release_package.py'):
              text = Path(rel).read_text(encoding='utf-8')
              assert r'1\.15\.0' not in text, rel
          PY
          git diff --check

      - name: Commit validated formal release-gate fixes
        shell: bash
        run: |
          set -euo pipefail
          git add RELEASE_NOTES.md tools/build_release_package.py tools/verify_release_package.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: complete Version 1.16.0 package gate'
          git push origin HEAD:release/v1.16.0-publish
