name: Temporary V1.15.0 publish

on:
  push:
    branches:
      - v1.15.0-release

permissions:
  contents: write

concurrency:
  group: tmp-v115-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_SHA: 359897e57e29eb2c8a422d938f630c36e7cee0d5
      TAG: v1.15.0
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: 359897e57e29eb2c8a422d938f630c36e7cee0d5
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          grep -Fq "const APP_VERSION = '1.15.0';" app/version.php
          grep -Fq "const APP_VERSION_LABEL = 'RSS Reader Modernization 1.15.0';" app/version.php
          grep -Fq '# RSS Reader Modernization 1.15.0 Release Notes' RELEASE_NOTES.md
          git diff --check
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; refusing to overwrite."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; refusing to overwrite."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/v115-release"
          mkdir -p "$out"
          python tools/build_complete_package.py --output-dir "$out"
          python tools/build_release_package.py --mode final --output-dir "$out"
          python tools/verify_complete_package.py \
            "$out/rss-reader-modernization-1.15.0-complete.zip" \
            "$out/rss-reader-modernization-1.15.0-complete.zip.sha256"
          python tools/verify_release_package.py \
            "$out/rss-reader-modernization-1.15.0.zip" \
            "$out/rss-reader-modernization-1.15.0.zip.sha256"
          echo 'a8068bcd18bdfbbe9191d08ff83853008df67d2f34d50adedbb53ab8e98efab2  '"$out"'/rss-reader-modernization-1.15.0.zip' | sha256sum -c -
          echo '662b9e8c684a98b9bf86b53af90586c028de8dc9bc804be2e48358f23d6a78c3  '"$out"'/rss-reader-modernization-1.15.0-complete.zip' | sha256sum -c -

      - name: Build and verify production update package
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/v115-release"
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.')
          out = Path(__import__('os').environ['RUNNER_TEMP']) / 'v115-release'
          files = [
              'app/air_quality.php',
              'app/api.php',
              'app/bootstrap.php',
              'app/dashboard_widget.php',
              'app/earthquake.php',
              'app/information_widget.php',
              'app/sun_moon.php',
              'app/version.php',
              'app/weather.php',
              'public/js/utility-widgets.js',
          ]
          target = out / 'rss-reader-modernization-1.15.0-production-update.zip'
          with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for rel in files:
                  data = (root / rel).read_bytes()
                  info = zipfile.ZipInfo(rel, (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = (0o100644 << 16)
                  zf.writestr(info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          PY
          echo '44a623a743691851163ae5f247f94b9d4c3361b31daf0444c8d794a5afc71d67  '"$out"'/rss-reader-modernization-1.15.0-production-update.zip' | sha256sum -c -
          (cd "$out" && sha256sum rss-reader-modernization-1.15.0-production-update.zip > rss-reader-modernization-1.15.0-production-update.zip.sha256)
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'v115-release' / 'rss-reader-modernization-1.15.0-production-update.zip'
          with zipfile.ZipFile(p) as zf:
              names = zf.namelist()
          roots = {n.split('/', 1)[0] for n in names if n}
          if roots != {'app', 'public'}:
              raise SystemExit(f'unexpected production roots: {sorted(roots)}')
          if len(names) != 10:
              raise SystemExit(f'unexpected production update file count: {len(names)}')
          print('Production Update ZIP: app/public only, 10 files')
          PY

      - name: Create annotated tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/v115-release"
          git config user.name 'zeijaku'
          git config user.email 'zeijaku.net@gmail.com'
          git tag -a "$TAG" "$TARGET_SHA" -m 'RSS Reader Modernization 1.15.0'
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" \
            --verify-tag \
            --target "$TARGET_SHA" \
            --title 'RSS Reader Modernization 1.15.0' \
            --notes-file RELEASE_NOTES.md \
            "$out/rss-reader-modernization-1.15.0.zip" \
            "$out/rss-reader-modernization-1.15.0.zip.sha256" \
            "$out/rss-reader-modernization-1.15.0-complete.zip" \
            "$out/rss-reader-modernization-1.15.0-complete.zip.sha256" \
            "$out/rss-reader-modernization-1.15.0-production-update.zip" \
            "$out/rss-reader-modernization-1.15.0-production-update.zip.sha256"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 "$TAG")" = "$TARGET_SHA"
          gh release view "$TAG" --json tagName,name,isDraft,isPrerelease,targetCommitish,url,assets > "${RUNNER_TEMP}/release.json"
          cat "${RUNNER_TEMP}/release.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          expected = {
              'rss-reader-modernization-1.15.0.zip',
              'rss-reader-modernization-1.15.0.zip.sha256',
              'rss-reader-modernization-1.15.0-complete.zip',
              'rss-reader-modernization-1.15.0-complete.zip.sha256',
              'rss-reader-modernization-1.15.0-production-update.zip',
              'rss-reader-modernization-1.15.0-production-update.zip.sha256',
          }
          actual = {a['name'] for a in data.get('assets', [])}
          if data.get('isDraft') or data.get('isPrerelease'):
              raise SystemExit('release unexpectedly draft/prerelease')
          if actual != expected:
              raise SystemExit(f'asset mismatch: expected={sorted(expected)}, actual={sorted(actual)}')
          print('Published Release assets verified:', len(actual))
          PY
        env:
          GH_TOKEN: ${{ github.token }}
