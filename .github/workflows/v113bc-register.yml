name: V1.13 B-C commit registration

on:
  push:
    branches:
      - 'tmp/v113bc-register'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Assemble and verify patches
        shell: bash
        run: |
          set -euo pipefail

          # part04 lost exactly one Base64 character while being staged through the connector.
          # Reconstruct it only in /tmp and accept it only when the expected Git blob SHA matches.
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import string

          src = Path('.github/tmp/v113b.part04.b64').read_text(encoding='utf-8')
          expected = 'd2495b43d3d8f5774516ac067ee46d627baeb4e4'
          if len(src) != 11999:
              raise SystemExit(f'unexpected staged part04 length: {len(src)}')

          header = b'blob 12000\0'
          alphabet = string.ascii_letters + string.digits + '+/'
          src_bytes = src.encode('ascii')
          base = hashlib.sha1(header)
          repaired = None

          for pos in range(len(src_bytes) + 1):
              prefix_hash = base.copy()
              prefix_hash.update(src_bytes[:pos])
              suffix = src_bytes[pos:]
              for char in alphabet.encode('ascii'):
                  candidate_hash = prefix_hash.copy()
                  candidate_hash.update(bytes((char,)))
                  candidate_hash.update(suffix)
                  if candidate_hash.hexdigest() == expected:
                      repaired = src_bytes[:pos] + bytes((char,)) + suffix
                      print(f'part04 repaired at offset {pos}')
                      break
              if repaired is not None:
                  break

          if repaired is None:
              raise SystemExit('part04 repair did not match expected Git blob SHA')

          Path('/tmp/v113b.part04.fixed.b64').write_bytes(repaired)
          PY

          test "$(git hash-object .github/tmp/v113b.part01.b64)" = 'c0cf09bff415d264bae2844c8450044e4ff0345b'
          test "$(git hash-object .github/tmp/v113b.part02.b64)" = '607e91e549c78da36e39e4d1203dfc615d054252'
          test "$(git hash-object .github/tmp/v113b.part03.b64)" = '084cc84ff8cbbc5eb3726e8f58ce5033fea2293a'
          test "$(git hash-object /tmp/v113b.part04.fixed.b64)" = 'd2495b43d3d8f5774516ac067ee46d627baeb4e4'
          test "$(git hash-object .github/tmp/v113b.part05.b64)" = 'ba6f76c1077c8d0bbaed6193ee5b792706dad802'
          test "$(git hash-object .github/tmp/v113c.part01.b64)" = '7eccb8fc07a4e879b863e05c6d1ba5eedabce4b4'
          test "$(git hash-object .github/tmp/v113c.part02.b64)" = '9d8e595c3352c0becdf1d7940a2e81ab80073005'
          test "$(git hash-object .github/tmp/v113c.part03.b64)" = '95060e96e1f2aeeb446bb3fbe059cfbe8d0287e0'

          cat \
            .github/tmp/v113b.part01.b64 \
            .github/tmp/v113b.part02.b64 \
            .github/tmp/v113b.part03.b64 \
            /tmp/v113b.part04.fixed.b64 \
            .github/tmp/v113b.part05.b64 \
            | base64 --decode | gzip --decompress > /tmp/v113b.patch

          cat \
            .github/tmp/v113c.part01.b64 \
            .github/tmp/v113c.part02.b64 \
            .github/tmp/v113c.part03.b64 \
            | base64 --decode | gzip --decompress > /tmp/v113c.patch

          echo '6b6827b3006a6bb9894eb9a72de674b9e1f286595a7d324cc26d66ad0e72f047  /tmp/v113b.patch' | sha256sum --check --strict
          echo '0cf8581086dc58325a88250203793de51552dcca97d3e0303d6686c8e55b52c5  /tmp/v113c.patch' | sha256sum --check --strict

      - name: Create exact B and C commits on temporary result branch
        shell: bash
        run: |
          set -euo pipefail
          BASE='f1a072b92c8ba65e6d38e355e7e6d6a4fe56c2c9'

          git fetch --no-tags origin feature/v1.13-structure
          CURRENT="$(git rev-parse refs/remotes/origin/feature/v1.13-structure)"
          test "$CURRENT" = "$BASE"

          git checkout -B v113-register refs/remotes/origin/feature/v1.13-structure
          test -z "$(git status --porcelain)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git apply --check /tmp/v113b.patch
          git apply /tmp/v113b.patch
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '24'
          git add -A
          git commit -m 'refactor: split stock page for V1.13-B' \
            -m 'Split Stock rendering to public/stock.php, keep legacy URL compatibility, and expose the canonical extensionless /stock route. Includes focused regression coverage and V1.13-B R2 documentation. No DB migration or application version change.'
          B_SHA="$(git rev-parse HEAD)"

          git apply --check /tmp/v113c.patch
          git apply /tmp/v113c.patch
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = '17'
          git add -A
          git commit -m 'refactor: split settings page for V1.13-C' \
            -m 'Move Display Settings, tab names, and RSS Highlight management to public/settings.php and expose the canonical extensionless /settings route. Account Settings remains separate. Includes focused regression coverage and V1.13-C documentation. No DB migration or application version change.'
          C_SHA="$(git rev-parse HEAD)"

          test "$(git rev-list --count "$BASE"..HEAD)" = '2'
          test "$(git diff --name-only "$BASE" "$B_SHA" | wc -l | tr -d ' ')" = '24'
          test "$(git diff --name-only "$B_SHA" "$C_SHA" | wc -l | tr -d ' ')" = '17'
          test -z "$(git status --porcelain)"

          echo "B_SHA=$B_SHA"
          echo "C_SHA=$C_SHA"
          git log --oneline --decorate -3

          git push origin HEAD:refs/heads/tmp/v113bc-result
