name: V1.21-A Focused Check

on:
  push:
    branches:
      - v1.21-a-drawer-categories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: V1.21-A focused tests
        run: sh tests/run-v121a.sh

      - name: Build Production overwrite ZIP
        run: |
          set -eu
          ROOT="$GITHUB_WORKSPACE"
          OUT="$ROOT/build/v1.21-a-overwrite"
          mkdir -p "$OUT/app" "$OUT/public/js"
          cp "$ROOT/app/version.php" "$OUT/app/version.php"
          cp "$ROOT/public/settings.php" "$OUT/public/settings.php"
          cp "$ROOT/public/js/calendar.js" "$OUT/public/js/calendar.js"
          cp "$ROOT/public/js/drawer-categories.js" "$OUT/public/js/drawer-categories.js"
          cat > "$OUT/V1.21-A_APPLY_NOTE.txt" <<'NOTE'
          RSS Reader Modernization V1.21-A Production Check
          Baseline: v1.20.1 / ac4d265032311d5d41a954b8b9713e9dd3f1e257

          Overwrite the files while preserving their paths.
          No database migration is required.
          No config/local.php change is required.
          After deployment, hard reload the browser once and verify Drawer categories and modal transitions.
          NOTE
          cd "$OUT"
          zip -r "$ROOT/build/rss-reader-v1.21-a-overwrite.zip" .

      - name: Upload Production overwrite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-v1.21-a-overwrite
          path: build/rss-reader-v1.21-a-overwrite.zip
          if-no-files-found: error
          retention-days: 14
