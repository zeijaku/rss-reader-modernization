name: V1.21-C Focused Check

on:
  push:
    branches:
      - v1.21-c-mobile-touch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: V1.21-C focused tests
        run: sh tests/run-v121c.sh

      - name: Build Production overwrite ZIP
        run: |
          set -eu
          ROOT="$GITHUB_WORKSPACE"
          OUT="$ROOT/build/v1.21-c-overwrite"
          mkdir -p "$OUT/app" "$OUT/public/js" "$OUT/public/css"
          cp "$ROOT/app/version.php" "$OUT/app/version.php"
          cp "$ROOT/public/js/calendar.js" "$OUT/public/js/calendar.js"
          cp "$ROOT/public/js/drawer-categories.js" "$OUT/public/js/drawer-categories.js"
          cp "$ROOT/public/css/drawer-v121c.css" "$OUT/public/css/drawer-v121c.css"
          printf '%s\n' \
            'RSS Reader Modernization V1.21-C Production Check' \
            'Baseline: V1.21-B R1 / 616b646ac80a1c377d4a67fe558c59efcd030522' \
            '' \
            'Apply after the latest V1.21-B Production check files.' \
            'Overwrite the files while preserving their paths.' \
            'No database migration is required.' \
            'No config/local.php change is required.' \
            'Hard reload once, then verify Smartphone Drawer scrolling, touch targets, and Modal transitions.' \
            > "$OUT/V1.21-C_APPLY_NOTE.txt"
          cd "$OUT"
          zip -r "$ROOT/build/rss-reader-v1.21-c-overwrite.zip" .

      - name: Upload Production overwrite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rss-reader-v1.21-c-overwrite
          path: build/rss-reader-v1.21-c-overwrite.zip
          if-no-files-found: error
          retention-days: 14
